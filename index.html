
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>AXON AI</title>
<style>
:root{
--bg:#07111f;--panel:#10243a;--panel2:#0c1b2c;
--line:#29445f;--text:#f2f7ff;--muted:#91a9c1;
--cyan:#35d5f5;
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font-family:Arial,sans-serif;height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
#splash{
position:fixed;inset:0;background:var(--bg);
display:grid;place-items:center;
z-index:99;color:var(--cyan);font-size:38px;
font-weight:bold;
}
#app{display:flex;height:100vh}
.sidebar{
width:270px;background:var(--panel2);
border-right:1px solid var(--line);
padding:15px;display:flex;flex-direction:column;
gap:10px;overflow-y:auto;
}
.brand{font-size:27px;color:var(--cyan);
font-weight:bold;padding:12px}
.menu{
background:var(--panel);color:white;
border:1px solid var(--line);
border-radius:13px;padding:13px;
text-align:left;width:100%;
}
.menu:hover,.action:hover{border-color:var(--cyan)}
.settings{
border:1px solid var(--line);
border-radius:15px;padding:12px;
}
.settings h3{color:var(--cyan)}
.history{margin-top:auto}
.history button{margin-top:7px}
.main{flex:1;min-width:0;display:flex;
flex-direction:column}
.topbar{
padding:17px 22px;border-bottom:1px solid var(--line);
display:flex;justify-content:space-between;
align-items:center;
}
.topbar strong{color:var(--cyan);font-size:23px}
.chat{
flex:1;overflow-y:auto;padding:22px;
width:100%;max-width:950px;margin:auto;
}
.message{
padding:14px 18px;border-radius:17px;
margin:12px 0;max-width:85%;
line-height:1.6;white-space:pre-wrap;
overflow-wrap:anywhere;
}
.user{background:#16425a;margin-left:auto}
.bot{background:var(--panel);
border:1px solid var(--line)}
.composer{
width:100%;max-width:950px;margin:auto;
padding:12px;display:flex;gap:8px;
align-items:center;
}
.composer textarea{
flex:1;min-width:0;resize:none;
min-height:53px;max-height:130px;
padding:16px;border-radius:17px;
background:var(--panel);border:1px solid var(--line);
color:white;outline:none;
}
.action{
background:var(--panel);color:var(--cyan);
border:1px solid var(--line);
border-radius:14px;padding:14px;
font-size:18px;
}
.status{padding:0 15px 10px;color:var(--muted);
font-size:13px}
.popup{
position:fixed;bottom:85px;left:15px;
background:var(--panel2);
border:1px solid var(--line);
border-radius:16px;padding:12px;
width:190px;z-index:20;
}
.popup button{margin:5px 0}
video{width:100%;max-height:350px;
border-radius:15px;background:#000}
#cameraBox{
position:fixed;inset:10%;
background:var(--panel2);z-index:30;
padding:20px;border:1px solid var(--line);
border-radius:20px;overflow:auto;
}
@media(max-width:700px){
.sidebar{width:75px;padding:7px}
.brand{font-size:14px;padding:8px}
.sidebar .menu{font-size:10px;
padding:12px 3px;text-align:center}
.settings,.history{display:none}
.composer{padding:8px;gap:5px}
.action{padding:12px 9px}
}
</style>
</head>
<body>

<div id="splash">AXON AI</div>

<section id="app" class="hidden">

<aside class="sidebar">
<div class="brand">AXON AI</div>

<button class="menu" id="settingsButton">
⚙ Settings
</button>

<div id="settings" class="settings hidden">
<h3>Settings</h3>
<button class="menu" id="voiceButton">
🎙 Voice Control: OFF
</button>
<button class="menu" id="profileButton">
👤 Profile
</button>
<button class="menu" id="imageButton">
🖼 Image Generator
</button>
<button class="menu" id="videoButton">
🎬 Video Generator
</button>
<button class="menu" id="themeButton">
🌙 Dark Theme: ON
</button>
<button class="menu" id="logoutButton">
Logout
</button>
</div>

<div class="history">
<h3>History</h3>
<div id="historyList"></div>
<button class="menu" id="seeAll">See All →</button>
<button class="menu" id="newChat">＋ New Chat</button>
</div>
</aside>

<main class="main">
<header class="topbar">
<strong>AXON AI</strong>
<span id="welcome">Your AI Assistant</span>
</header>

<div class="chat" id="chat">
<div class="message bot">
Hello! Main AXON AI hoon.
Aap mujhse text, voice aur supported media
ke through baat kar sakte hain.
</div>
</div>

<div id="cameraBox" class="hidden">
<h3 id="cameraTitle">Live Camera</h3>
<video id="camera" autoplay playsinline></video>
<button class="action" id="stopCamera">Stop</button>
</div>

<div class="composer">
<button class="action" id="plusButton">＋</button>

<textarea id="prompt"
placeholder="Message AXON AI..."></textarea>

<button class="action" id="sendButton">➤</button>
<button class="action" id="callButton">📞</button>
</div>

<div class="status" id="status">AXON AI Ready</div>
</main>
</section>

<div id="plusMenu" class="popup hidden">
<button class="menu" id="photoOption">🖼 Photo</button>
<button class="menu" id="cameraOption">📷 Camera</button>
<button class="menu" id="fileOption">📁 Files</button>
<button class="menu" id="videoCallOption">📹 Video Call</button>
<button class="menu" id="recordOption">🎥 Screen Record</button>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="fileInput" hidden>
<input type="file" id="videoInput" accept="video/*" hidden>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig={
apiKey:"YOUR_FIREBASE_API_KEY",
authDomain:"axon-ai-9ee3b.firebaseapp.com",
projectId:"axon-ai-9ee3b",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
appId:"YOUR_FIREBASE_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const $=id=>document.getElementById(id);

let history=[];
let voiceEnabled=false;
let stream=null;
let recorder=null;
let chunks=[];
let recording=false;

const API={
chat:"/api/chat",
image:"/api/image",
video:"/api/video",
live:"/api/live-session"
};

function status(t){$("status").textContent=t}

onAuthStateChanged(auth,user=>{
$("splash").classList.add("hidden");
$("app").classList.remove("hidden");

if(user){
$("welcome").textContent="Welcome "+(user.displayName||"User");
}
});

function addMessage(text,type){
const div=document.createElement("div");
div.className="message "+type;
div.textContent=text;
$("chat").appendChild(div);
$("chat").scrollTop=$("chat").scrollHeight;
}

function saveHistory(){
const item={
title:history[0]?.content?.slice(0,30)||"New Chat",
messages:history
};
const list=JSON.parse(localStorage.getItem("axonChats")||"[]");
const filtered=list.filter(x=>x.id!==chatId);
filtered.unshift({...item,id:chatId});
localStorage.setItem("axonChats",JSON.stringify(filtered.slice(0,30)));
loadHistory();
}

let chatId=Date.now();

function loadHistory(){
const list=JSON.parse(localStorage.getItem("axonChats")||"[]");
$("historyList").innerHTML="";

list.slice(0,3).forEach(item=>{
const b=document.createElement("button");
b.className="menu";
b.textContent=item.title||"Conversation";
b.onclick=()=>openChat(item);
$("historyList").appendChild(b);
});
}

function openChat(item){
chatId=item.id;
history=item.messages||[];
$("chat").innerHTML="";
history.forEach(m=>addMessage(
m.content,m.role==="user"?"user":"bot"
));
}

$("seeAll").onclick=()=>{
const list=JSON.parse(localStorage.getItem("axonChats")||"[]");
$("chat").innerHTML="";
list.forEach((item,i)=>{
addMessage((i+1)+". "+item.title,"bot");
});
};

$("newChat").onclick=()=>{
chatId=Date.now();
history=[];
$("chat").innerHTML="";
addMessage("New conversation started!","bot");
};

async function sendMessage(){
const message=$("prompt").value.trim();
if(!message)return;

$("prompt").value="";
addMessage(message,"user");
history.push({role:"user",content:message});
status("AXON AI Thinking...");

try{
const res=await fetch(API.chat,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message,history})
});

if(!res.ok)throw Error("API Error "+res.status);

const data=await res.json();
const reply=data.reply||data.response||data.answer;

if(!reply)throw Error("Empty AI response");

addMessage(reply,"bot");
history.push({role:"assistant",content:reply});
saveHistory();

if(voiceEnabled){
const speech=new SpeechSynthesisUtterance(reply);
speech.lang="hi-IN";
speechSynthesis.speak(speech);
}
status("AXON AI Ready");

}catch(e){
addMessage("Server connection problem. Backend API check karein.","bot");
status(e.message);
}
}

$("sendButton").onclick=sendMessage;

$("prompt").addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

$("settingsButton").onclick=()=>{
$("settings").classList.toggle("hidden");
};

$("voiceButton").onclick=()=>{
voiceEnabled=!voiceEnabled;
$("voiceButton").textContent=
"🎙 Voice Control: "+(voiceEnabled?"ON":"OFF");
status("Voice "+(voiceEnabled?"Enabled":"Disabled"));
};

$("profileButton").onclick=()=>{
const u=auth.currentUser;
alert("Name: "+(u?.displayName||"Not set")+
"\nEmail: "+(u?.email||"Not logged in"));
};

$("logoutButton").onclick=()=>signOut(auth);

$("themeButton").onclick=()=>{
const light=document.body.dataset.theme!=="light";
document.body.dataset.theme=light?"light":"dark";

const vars=light?
["#edf4fa","#dce9f3","#d2e2ef","#10243a"]:
["#07111f","#10243a","#0c1b2c","#f2f7ff"];

["--bg","--panel","--panel2","--text"].forEach((v,i)=>{
document.documentElement.style.setProperty(v,vars[i]);
});

$("themeButton").textContent=
"🌙 Dark Theme: "+(light?"OFF":"ON");
};

$("plusButton").onclick=()=>{
$("plusMenu").classList.toggle("hidden");
};

$("photoOption").onclick=()=>$("photoInput").click();
$("fileOption").onclick=()=>$("fileInput").click();

function selectedFile(file){
if(!file)return;
addMessage("Selected: "+file.name,"user");
status("File selected. Upload API required to send it to AI.");
}

$("photoInput").onchange=e=>selectedFile(e.target.files[0]);
$("fileInput").onchange=e=>selectedFile(e.target.files[0]);

async function startCamera(videoCall=false){
try{
stream=await navigator.mediaDevices.getUserMedia({
video:true,audio:true
});

$("camera").srcObject=stream;
$("cameraTitle").textContent=
videoCall?"Video Call Preview":"Camera Preview";
$("cameraBox").classList.remove("hidden");
$("plusMenu").classList.add("hidden");

status(videoCall?
"Local video preview. Connect WebRTC server for remote calls.":
"Camera Started");

}catch(e){status("Camera/Microphone permission required.");}
}

$("cameraOption").onclick=()=>startCamera();
$("videoCallOption").onclick=()=>startCamera(true);

$("stopCamera").onclick=()=>{
if(stream)stream.getTracks().forEach(t=>t.stop());
stream=null;
$("cameraBox").classList.add("hidden");
status("Camera stopped");
};

$("callButton").onclick=async()=>{
try{
const response=await fetch(API.live,{method:"POST"});
if(!response.ok)throw Error();
const data=await response.json();
if(data.url)window.open(data.url,"_blank");
else status("Live session response received.");
}catch(e){
status("Live calling requires a connected WebRTC backend.");
}
};

async function startRecording(){
try{
const screen=await navigator.mediaDevices.getDisplayMedia({
video:true,audio:true
});

recorder=new MediaRecorder(screen);
chunks=[];

recorder.ondataavailable=e=>{
if(e.data.size)chunks.push(e.data);
};

recorder.onstop=()=>{
const blob=new Blob(chunks,{type:"video/webm"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="AXON-Recording.webm";
a.click();
URL.revokeObjectURL(url);
screen.getTracks().forEach(t=>t.stop());
recording=false;
status("Recording saved");
};

recorder.start();
recording=true;
status("Screen recording started");

recorder.onerror=()=>status("Recording error");

}catch(e){status("Screen recording permission required.");}
}

$("recordOption").onclick=()=>{
$("plusMenu").classList.add("hidden");
if(!recording)startRecording();
else if(recorder?.state==="recording")recorder.stop();
};

$("imageButton").onclick=async()=>{
const prompt=window.prompt("Describe your image:");
if(!prompt)return;

status("Generating image...");
try{
const r=await fetch(API.image,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({prompt})
});
if(!r.ok)throw Error();
const d=await r.json();
if(d.url){
const img=document.createElement("img");
img.src=d.url;
img.style.maxWidth="100%";
img.style.borderRadius="15px";
$("chat").appendChild(img);
}else status("Image response received.");
}catch(e){status("Connect Image Generation API.");}
};

$("videoButton").onclick=async()=>{
const prompt=window.prompt("Describe your video:");
if(!prompt)return;

status("Video generation started...");
try{
const r=await fetch(API.video,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({prompt})
});
if(!r.ok)throw Error();
const d=await r.json();
if(d.url){
const video=document.createElement("video");
video.controls=true;
video.src=d.url;
$("chat").appendChild(video);
}else status("Video processing started.");
}catch(e){status("Connect Video Generation API.");}
};

/* SPEECH RECOGNITION */

$("micButton").onclick=()=>{
const SR=window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SR){
status("Speech recognition not supported in this browser.");
return;
}

const recognition=new SR();
recognition.lang="hi-IN";
recognition.onstart=()=>status("Listening...");
recognition.onresult=e=>{
$("prompt").value=e.results[0][0].transcript;
if(voiceEnabled)sendMessage();
};
recognition.onerror=()=>status("Microphone error");
recognition.start();
};

window.addEventListener("load",()=>{
loadHistory();
setTimeout(()=>$("splash").classList.add("hidden"),700);
});

</script>
</body>
</html>

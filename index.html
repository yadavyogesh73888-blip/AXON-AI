
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>AXON AI — Advanced AI Solutions</title>

<style>
:root{
  --bg:#07111f;
  --panel:#0d1c2e;
  --line:#29445f;
  --text:#f2f7ff;
  --muted:#91a9c1;
  --cyan:#46e0d3;
  --blue:#4c83ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 50% 0%,#172b49 0%,#090f1d 55%,#060a13 100%);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  z-index:100;
  background:#030812;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:opacity .4s,visibility .4s;
}
#splash.done{opacity:0;visibility:hidden}
.splash-image{
  width:250px;
  height:250px;
  max-width:80vw;
  max-height:80vw;
  object-fit:contain;
  position:relative;
}

/* MAIN LAYOUT */
.container{
  max-width:1100px;
  min-height:100vh;
  margin:auto;
  padding:0 24px;
  display:flex;
  flex-direction:column;
}
header{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--cyan);
  font-size:21px;
  font-weight:850;
  letter-spacing:3px;
}
.brand-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:white;
  font-size:17px;
  background:linear-gradient(135deg,#456df0,#08a9ad);
  box-shadow:0 7px 25px #00c9c933;
}
.header-actions{display:flex;align-items:center;gap:10px}
button{
  border:1px solid transparent;
  border-radius:12px;
  padding:11px 16px;
  background:linear-gradient(110deg,#3159c9,#078e9d);
  font-weight:650;
  transition:.2s;
}
button:hover:not(:disabled){filter:brightness(1.13);transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.98)}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:3px;
}
.secondary{
  background:#12263c;
  border-color:var(--line);
}
.icon-button{
  width:43px;
  height:43px;
  padding:0;
  display:grid;
  place-items:center;
  font-size:19px;
  background:#12263c;
  border-color:var(--line);
}
#logoutBtn{padding:11px 17px}

/* LOGIN */
#authPanel{
  width:min(100%,440px);
  margin:55px auto;
  padding:32px;
  border:1px solid #31536f;
  border-radius:25px;
  background:linear-gradient(150deg,#122b43,#0b192a);
  box-shadow:0 25px 75px #0008;
}
.auth-brand{text-align:center;margin-bottom:25px}
.auth-logo{
  width:67px;
  height:67px;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:linear-gradient(135deg,#456df0,#08a9ad);
  box-shadow:0 10px 30px #3159c955;
  font-size:25px;
  font-weight:900;
}
.auth-brand h1{margin:0;font-size:25px;letter-spacing:3px}
.auth-brand p{color:var(--muted);font-size:13px;margin:8px 0 0}
.auth-label{
  display:block;
  color:#b7cadd;
  font-size:12px;
  font-weight:650;
  margin:15px 0 7px;
}
input,textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#071522;
  color:white;
  outline:none;
}
input:focus,textarea:focus{border-color:var(--cyan)}
.auth-input{min-height:49px}
.actions{
  display:flex;
  flex-direction:column;
  gap:11px;
  margin-top:20px;
}
.actions button{width:100%;min-height:48px}
#loginBtn{background:linear-gradient(110deg,#3159c9,#078e9d)}
.auth-divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:17px 0;
  color:#7892aa;
  font-size:11px;
  letter-spacing:2px;
}
.auth-divider:before,.auth-divider:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--line);
}
.auth-links{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:15px;
}
.text-button{
  padding:7px 2px;
  border:0;
  background:transparent;
  color:var(--cyan);
  font-size:12px;
}
#status{
  min-height:20px;
  color:var(--muted);
  font-size:12px;
  margin-top:17px;
  overflow-wrap:anywhere;
  text-align:center;
}

/* CHAT */
#chat{
  display:none;
  flex:1;
  min-height:0;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:22px 0;
}
.chat-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.chat-heading h2{margin:0;font-size:23px}
.small{color:var(--muted);font-size:12px}
#messages{
  height:52vh;
  min-height:260px;
  overflow-y:auto;
  padding:17px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#081625;
}
.message{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:13px 16px;
  margin:12px 0;
  border-radius:15px;
  max-width:85%;
  line-height:1.6;
}
.user{
  background:linear-gradient(135deg,#244777,#1b3762);
  margin-left:auto;
  border:1px solid #355b91;
}
.ai{
  background:#142b40;
  border:1px solid #25445d;
}
.composer{
  display:flex;
  align-items:flex-end;
  gap:10px;
  margin-top:14px;
  padding:11px;
  border:1px solid #315b78;
  border-radius:19px;
  background:#10243a;
}
.composer textarea{
  flex:1;
  resize:vertical;
  min-height:48px;
  max-height:130px;
  margin:0;
  border:0;
  background:transparent;
}
.composer textarea:focus{outline:none}
#sendBtn{
  width:46px;
  height:46px;
  flex:none;
  padding:0;
  border-radius:14px;
  font-size:20px;
}
.chat-footer{text-align:center;margin-top:12px}

/* SETTINGS PANEL */
#settingsPanel{
  display:none;
  position:fixed;
  z-index:50;
  inset:0;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#0009;
}
#settingsPanel.open{display:flex}
.settings-card{
  width:min(100%,390px);
  padding:24px;
  border:1px solid #31536f;
  border-radius:22px;
  background:#0d1c2e;
  box-shadow:0 25px 80px #0009;
}
.settings-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}
.settings-head h2{margin:0;font-size:20px}
.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}
.setting-row span{font-size:14px}
.setting-row button{font-size:12px}
#closeSettings{width:38px;height:38px;padding:0}

/* MOBILE */
@media(max-width:600px){
  .container{padding:0 14px}
  header{min-height:68px}
  .brand{font-size:18px;gap:9px}
  .brand-icon{width:39px;height:39px}
  .header-actions{gap:7px}
  .icon-button{width:40px;height:40px}
  #authPanel{margin:35px auto;padding:25px 21px;border-radius:22px}
  .auth-logo{width:59px;height:59px}
  #chat{padding:17px 0}
  .chat-heading h2{font-size:20px}
  #messages{height:55vh;padding:12px}
  .message{max-width:90%;font-size:14px}
  .composer{padding:8px;gap:7px}
  .composer textarea{font-size:14px}
  #sendBtn{width:42px;height:42px}
}
</style>
</head>

<body>

<div id="splash">
  <img src="/IMG_20261114_073941.png" alt="AXON AI" class="splash-image">
</div>

<div class="container">

<header>
  <div class="brand">
    <div class="brand-icon">AX</div>
    <span>AXON AI</span>
  </div>
  <div class="header-actions">
    <button id="settingsBtn" class="icon-button" type="button" aria-label="Settings">⚙</button>
    <button id="logoutBtn" class="secondary hidden">Logout</button>
  </div>
</header>

<section id="authPanel" class="panel">
  <div class="auth-brand">
    <div class="auth-logo">AX</div>
    <h1>Welcome to AXON AI</h1>
    <p>Your personal AI workspace</p>
  </div>

  <label class="auth-label" for="email">Email address</label>
  <input class="auth-input" id="email" type="email" placeholder="Enter your email">

  <label class="auth-label" for="password">Password</label>
  <input class="auth-input" id="password" type="password" placeholder="Enter your password">

  <div class="actions">
    <button id="loginBtn">Sign In</button>
    <button id="signupBtn" class="secondary">Create Account</button>
  </div>

  <div class="auth-divider">OR</div>

  <button id="googleBtn" class="secondary" style="width:100%">Continue with Google</button>

  <div class="auth-links">
    <button id="forgotBtn" class="text-button">Forgot Password?</button>
    <span class="small">Secure Login</span>
  </div>

  <p id="status">Connecting to Firebase...</p>
</section>

<section id="chat">
  <div class="chat-heading">
    <div>
      <h2>AXON AI Chat</h2>
      <p class="small" id="welcomeUser"></p>
    </div>
    <button id="newChatBtn" class="secondary">＋ New Chat</button>
  </div>

  <div id="messages">
    <div class="message ai">Hello! I am AXON AI. How can I help you?</div>
  </div>

  <div class="composer">
    <textarea id="prompt" rows="2" placeholder="Message AXON AI..."></textarea>
    <button id="sendBtn" aria-label="Send message">➤</button>
  </div>

  <p class="small chat-footer">AXON AI Assistant · Check important information</p>
</section>

</div>

<div id="settingsPanel">
  <div class="settings-card">
    <div class="settings-head">
      <h2>⚙ Settings</h2>
      <button id="closeSettings" class="secondary" type="button">✕</button>
    </div>
    <div class="setting-row">
      <span>Account</span>
      <span class="small">AXON AI</span>
    </div>
    <div class="setting-row">
      <span>Appearance</span>
      <button id="themeBtn" class="secondary" type="button">Dark Theme</button>
    </div>
    <div class="setting-row">
      <span>App Version</span>
      <span class="small">AXON AI</span>
    </div>
  </div>
</div>

<script>
/* Splash backup: Firebase load fail hone par bhi screen nahi atkegi */
const splash = document.getElementById("splash");
const authPanel = document.getElementById("authPanel");
const statusText = document.getElementById("status");

const splashTimer = setTimeout(() => {
  splash.classList.add("done");
  statusText.textContent =
    "Firebase load nahi hua. Page refresh karke dobara try karein.";
}, 12000);

function hideSplash(){
  clearTimeout(splashTimer);
  splash.classList.add("done");
}

function showStatus(message){
  statusText.textContent = message;
}

/* UI-only settings */
const settingsPanel = document.getElementById("settingsPanel");
document.getElementById("settingsBtn").addEventListener("click",()=>{
  settingsPanel.classList.add("open");
});
document.getElementById("closeSettings").addEventListener("click",()=>{
  settingsPanel.classList.remove("open");
});
settingsPanel.addEventListener("click",event=>{
  if(event.target===settingsPanel) settingsPanel.classList.remove("open");
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  showStatus("Dark theme is active.");
});
</script>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail,
  signOut
} from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* AXON AI FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyA-YnGuAr8BdGt8xbo0Eq06lijQEPoeTC8",
  authDomain: "axon-ai-9ee3b.firebaseapp.com",
  projectId: "axon-ai-9ee3b",
  storageBucket: "axon-ai-9ee3b.firebasestorage.app",
  messagingSenderId: "304665322304",
  appId: "1:304665322304:web:b409df4442f3cf018710a5",
  measurementId: "G-NBP2KRZWSG"
};

let auth;

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");
const googleBtn = document.getElementById("googleBtn");
const forgotBtn = document.getElementById("forgotBtn");
const logoutBtn = document.getElementById("logoutBtn");
const chat = document.getElementById("chat");
const messages = document.getElementById("messages");
const promptInput = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

function getEmail(){
  return emailInput.value.trim();
}

function getPassword(){
  return passwordInput.value;
}

function showError(error){
  console.error("AXON ERROR:", error);
  showStatus(error.message || "Something went wrong.");
}

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);

  await setPersistence(auth, browserLocalPersistence);

  onAuthStateChanged(auth, user => {
    hideSplash();

    if(user){
      authPanel.classList.add("hidden");
      chat.style.display = "block";
      logoutBtn.classList.remove("hidden");
      document.getElementById("welcomeUser").textContent =
        "Logged in: " + (user.email || "Google user");
      showStatus("Firebase connected.");
    }else{
      authPanel.classList.remove("hidden");
      chat.style.display = "none";
      logoutBtn.classList.add("hidden");
      showStatus("Please login to continue.");
    }
  });

} catch(error) {
  hideSplash();
  showStatus("Firebase error: " + error.message);
  console.error(error);
}

loginBtn.addEventListener("click", async () => {
  try {
    if(!auth) throw new Error("Firebase is not ready.");
    await signInWithEmailAndPassword(
      auth,getEmail(),getPassword()
    );
  } catch(error){ showError(error); }
});

signupBtn.addEventListener("click", async () => {
  try {
    if(!auth) throw new Error("Firebase is not ready.");
    await createUserWithEmailAndPassword(
      auth,getEmail(),getPassword()
    );
    showStatus("Account created successfully.");
  } catch(error){ showError(error); }
});

googleBtn.addEventListener("click", async () => {
  try {
    if(!auth) throw new Error("Firebase is not ready.");
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth,provider);
  } catch(error){ showError(error); }
});

forgotBtn.addEventListener("click", async () => {
  try {
    if(!auth) throw new Error("Firebase is not ready.");
    if(!getEmail()) throw new Error("Pehle email address likhein.");
    await sendPasswordResetEmail(auth,getEmail());
    showStatus("Password reset email sent.");
  } catch(error){ showError(error); }
});

logoutBtn.addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch(error){ showError(error); }
});

document.getElementById("newChatBtn").addEventListener("click", () => {
  messages.innerHTML =
    '<div class="message ai">New chat started. How can I help?</div>';
});

function addMessage(text,type){
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage(){
  const prompt = promptInput.value.trim();
  if(!prompt || !auth?.currentUser) return;

  promptInput.value = "";
  addMessage(prompt,"user");

  const loading = addMessage("AXON AI is thinking...","ai");
  sendBtn.disabled = true;

  try {
    const token = await auth.currentUser.getIdToken();

    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + token
      },
      body:JSON.stringify({message:prompt})
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.message || data.error || "AI server error: " + response.status);
    }

    loading.textContent =
      data.reply || data.response || data.message ||
      "AI se response nahi mila.";

  } catch(error){
    loading.textContent = "Error: " + error.message;
    console.error("CHAT ERROR:",error);
  } finally {
    sendBtn.disabled = false;
    messages.scrollTop = messages.scrollHeight;
  }
}

sendBtn.addEventListener("click",sendMessage);

promptInput.addEventListener("keydown",event=>{
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>

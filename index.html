
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>AXON AI — Your AI Assistant</title>

<style>
:root{
 --bg:#07111f;
 --panel:#10243a;
 --panel2:#0c1b2c;
 --line:#29445f;
 --text:#f2f7ff;
 --muted:#91a9c1;
 --cyan:#35d6ff;
 --blue:#1677ff;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
 min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

/* SPLASH SCREEN */
#splash{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 background:radial-gradient(circle,#153d59,#07111f 70%);
 animation:splashOut 1s ease 2.4s forwards;
}
.splash-logo{
 font-size:42px;
 font-weight:900;
 letter-spacing:6px;
 color:var(--cyan);
 text-shadow:0 0 30px #35d6ff;
 animation:logoIn 1.3s ease;
}
.splash-line{
 width:130px;
 height:3px;
 margin-top:20px;
 background:linear-gradient(90deg,transparent,var(--cyan),transparent);
 animation:loading 1.5s infinite;
}
@keyframes logoIn{
 from{opacity:0;transform:scale(.7)}
 to{opacity:1;transform:scale(1)}
}
@keyframes loading{
 from{transform:scaleX(.3);opacity:.3}
 to{transform:scaleX(1);opacity:1}
}
@keyframes splashOut{
 to{opacity:0;visibility:hidden}
}

/* LOGIN */
.screen{display:none}
#authScreen{
 min-height:100vh;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.auth-card{
 width:100%;
 max-width:420px;
 padding:32px;
 background:linear-gradient(145deg,#132b42,#0b1929);
 border:1px solid var(--line);
 border-radius:22px;
 box-shadow:0 20px 70px #0008;
}
.brand{
 text-align:center;
 font-size:34px;
 font-weight:900;
 letter-spacing:4px;
 color:var(--cyan);
}
.auth-sub{
 text-align:center;
 color:var(--muted);
 margin-bottom:25px;
}
.auth-card h2{text-align:center}
.field{
 width:100%;
 padding:15px;
 margin:8px 0;
 border:1px solid var(--line);
 border-radius:11px;
 background:#071827;
 color:white;
 outline:none;
}
.field:focus{border-color:var(--cyan)}
.primary,.secondary{
 width:100%;
 border:0;
 padding:14px;
 margin-top:12px;
 border-radius:11px;
 font-weight:bold;
}
.primary{
 background:var(--cyan);
 color:#061421;
}
.secondary{
 background:#193650;
 color:white;
 border:1px solid var(--line);
}
.link-btn{
 background:none;
 border:0;
 color:var(--cyan);
 padding:12px;
}
.auth-actions{
 display:flex;
 justify-content:space-between;
 flex-wrap:wrap;
}
#authStatus{
 color:#ffb7a8;
 text-align:center;
 font-size:13px;
}

/* MAIN APP */
#appScreen{
 height:100dvh;
 flex-direction:column;
 overflow:hidden;
}
header{
 height:65px;
 flex-shrink:0;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 17px;
 border-bottom:1px solid var(--line);
 background:#091827;
 position:relative;
}
.header-brand{
 color:var(--cyan);
 font-weight:900;
 letter-spacing:3px;
}
.icon-btn{
 border:1px solid var(--line);
 background:#142b40;
 color:white;
 border-radius:10px;
 padding:10px 14px;
}
#menu{
 display:none;
 position:absolute;
 top:58px;
 left:12px;
 z-index:30;
 width:190px;
 padding:8px;
 background:#10243a;
 border:1px solid var(--line);
 border-radius:13px;
 box-shadow:0 15px 35px #0008;
}
#menu button{
 display:block;
 width:100%;
 padding:13px;
 text-align:left;
 background:none;
 border:0;
 color:white;
 border-radius:8px;
}
#menu button:hover{background:#1b3b55}

/* CHAT */
#chatArea{
 flex:1;
 overflow-y:auto;
 padding:22px 16px;
 scroll-behavior:smooth;
}
#welcome{
 max-width:700px;
 margin:auto;
 text-align:center;
 position:relative;
 top:25%;
}
#welcome h1{
 font-size:clamp(26px,5vw,42px);
 margin-bottom:12px;
}
#welcome p{color:var(--muted)}
.message{
 max-width:850px;
 width:fit-content;
 padding:14px 17px;
 margin:12px auto;
 border-radius:17px;
 line-height:1.6;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 margin-right:max(calc((100% - 850px)/2),0px);
 margin-left:auto;
 background:#16435e;
}
.ai{
 margin-left:max(calc((100% - 850px)/2),0px);
 margin-right:auto;
 background:#122a40;
 border:1px solid var(--line);
}
.typing{color:var(--cyan)}

/* COMPOSER */
footer{
 flex-shrink:0;
 padding:12px 15px 16px;
 background:#091827;
 border-top:1px solid var(--line);
}
.composer{
 max-width:850px;
 margin:auto;
 padding:10px;
 background:#10243a;
 border:1px solid var(--line);
 border-radius:17px;
}
#prompt{
 width:100%;
 min-height:48px;
 max-height:140px;
 resize:none;
 border:0;
 outline:none;
 background:transparent;
 color:white;
 padding:10px;
}
#prompt::placeholder{color:#91a9c1}
.toolbar{
 display:flex;
 align-items:center;
 gap:9px;
}
.tool-btn{
 padding:11px 14px;
 border:0;
 border-radius:10px;
 background:#193650;
 color:white;
}
.send-btn{
 margin-left:auto;
 background:var(--cyan);
 color:#061421;
 font-weight:bold;
}
#status{
 text-align:center;
 font-size:12px;
 color:var(--muted);
 padding-top:8px;
}

/* SETTINGS */
#settingsPanel{
 display:none;
 position:fixed;
 z-index:50;
 inset:0;
 background:#0009;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.settings-card{
 width:100%;
 max-width:380px;
 padding:24px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:18px;
}
.settings-card button{margin-top:10px}
.setting-row{
 padding:12px 0;
 border-bottom:1px solid var(--line);
 color:var(--muted);
}
@media(max-width:500px){
 .auth-card{padding:23px}
 header{padding:0 12px}
 footer{padding:9px}
 .message{max-width:94%}
 .user{margin-right:0}
 .ai{margin-left:0}
}
</style>
</head>

<body>

<div id="splash">
 <div class="splash-logo">AXON AI</div>
 <div class="splash-line"></div>
</div>

<!-- LOGIN SCREEN -->
<section id="authScreen" class="screen">
 <div class="auth-card">
  <div class="brand">AXON AI</div>
  <p class="auth-sub">Your intelligent AI assistant</p>

  <h2 id="authHeading">Welcome Back</h2>

  <input id="displayName" class="field"
   placeholder="Your name" style="display:none">

  <input id="email" class="field"
   type="email" placeholder="Email address">

  <input id="password" class="field"
   type="password" placeholder="Password">

  <button id="authButton" class="primary">Login</button>
  <button id="googleButton" class="secondary">
   Continue with Google
  </button>

  <div class="auth-actions">
   <button id="switchAuth" class="link-btn">
    Create account
   </button>
   <button id="forgotPassword" class="link-btn">
    Forgot password?
   </button>
  </div>

  <p id="authStatus"></p>
 </div>
</section>

<!-- MAIN CHAT SCREEN -->
<section id="appScreen" class="screen">

 <header>
  <button class="icon-btn" id="menuButton">•••</button>
  <div class="header-brand">AXON AI</div>
  <button class="icon-btn" id="newChatButton">＋</button>

  <div id="menu">
   <button id="menuNewChat">＋ New Chat</button>
   <button id="menuClear">Clear Chat</button>
   <button id="menuSettings">Settings</button>
   <button id="menuLogout">Logout</button>
  </div>
 </header>

 <main id="chatArea">
  <div id="welcome">
   <h1>HOW CAN I HELP YOU?</h1>
   <p>Ask anything. Explore ideas. Create something amazing.</p>
  </div>
 </main>

 <footer>
  <div class="composer">
   <textarea id="prompt"
    placeholder="Message AXON AI..."></textarea>

   <div class="toolbar">
    <button class="tool-btn" id="attachButton">＋</button>
    <input type="file" id="fileInput" hidden>

    <button class="tool-btn" id="micButton">🎙</button>

    <button class="tool-btn send-btn" id="sendButton">
     ASK AXON AI ➤
    </button>
   </div>
  </div>
  <div id="status">AXON AI Ready</div>
 </footer>
</section>

<!-- SETTINGS WINDOW -->
<div id="settingsPanel">
 <div class="settings-card">
  <h2>AXON AI Settings</h2>
  <div class="setting-row" id="accountInfo">
   Account information
  </div>
  <div class="setting-row">
   Version: AXON AI
  </div>
  <button class="secondary" id="closeSettings">Close</button>
  <button class="primary" id="settingsLogout">Logout</button>
 </div>
</div>

<script type="module">

/* FIREBASE CONNECTION */
import {initializeApp}
 from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth,onAuthStateChanged,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 GoogleAuthProvider,signInWithPopup,
 sendPasswordResetEmail,signOut,
 updateProfile
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* APNI EXISTING FIREBASE CONFIG YAHAN LAGANA */
const firebaseConfig={
 apiKey:"YOUR_FIREBASE_API_KEY",
 authDomain:"axon-ai-9ee3b.firebaseapp.com",
 projectId:"axon-ai-9ee3b",
 storageBucket:"YOUR_STORAGE_BUCKET",
 messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
 appId:"YOUR_FIREBASE_APP_ID"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const provider=new GoogleAuthProvider();

const $=id=>document.getElementById(id);

let signupMode=false;
let busy=false;
let chatHistory=[];

/* SCREEN MANAGEMENT */
function showStatus(message){
 $("status").textContent=message;
}
function showAuthStatus(message){
 $("authStatus").textContent=message;
}
function showScreen(user){
 $("authScreen").style.display=user?"none":"flex";
 $("appScreen").style.display=user?"flex":"none";
 if(user){
  $("accountInfo").textContent=
   "Signed in: "+(user.email||"AXON User");
 }
}
onAuthStateChanged(auth,user=>{
 showScreen(user);
});

/* LOGIN AND SIGNUP */
$("switchAuth").onclick=()=>{
 signupMode=!signupMode;
 $("displayName").style.display=
  signupMode?"block":"none";
 $("authHeading").textContent=
  signupMode?"Create Account":"Welcome Back";
 $("authButton").textContent=
  signupMode?"Sign Up":"Login";
 $("switchAuth").textContent=
  signupMode?"Already registered? Login":"Create account";
};

$("authButton").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email||!password){
  showAuthStatus("Email aur password enter karo.");
  return;
 }

 try{
  if(signupMode){
   const result=await createUserWithEmailAndPassword(
    auth,email,password
   );
   const name=$("displayName").value.trim();
   if(name){
    await updateProfile(result.user,{
     displayName:name
    });
   }
  }else{
   await signInWithEmailAndPassword(
    auth,email,password
   );
  }
  showAuthStatus("Login successful.");
 }catch(error){
  showAuthStatus(error.message);
 }
};

/* GOOGLE LOGIN */
$("googleButton").onclick=async()=>{
 try{
  await signInWithPopup(auth,provider);
 }catch(error){
  showAuthStatus(error.message);
 }
};

/* FORGOT PASSWORD */
$("forgotPassword").onclick=async()=>{
 const email=$("email").value.trim();
 if(!email){
  showAuthStatus("Pehle email enter karo.");
  return;
 }
 try{
  await sendPasswordResetEmail(auth,email);
  showAuthStatus("Password reset email sent.");
 }catch(error){
  showAuthStatus(error.message);
 }
};

/* LOGOUT */
async function logout(){
 try{
  await signOut(auth);
 }catch(error){
  alert(error.message);
 }
}
$("menuLogout").onclick=logout;
$("settingsLogout").onclick=logout;

/* MENU */
$("menuButton").onclick=()=>{
 const menu=$("menu");
 menu.style.display=
  menu.style.display==="block"?"none":"block";
};

/* SETTINGS */
function openSettings(){
 $("menu").style.display="none";
 $("settingsPanel").style.display="flex";
}
$("menuSettings").onclick=openSettings;
$("closeSettings").onclick=()=>{
 $("settingsPanel").style.display="none";
};

/* CHAT MESSAGE */
function addMessage(message,type){
 const element=document.createElement("div");
 element.className="message "+type;
 element.textContent=message;
 $("chatArea").appendChild(element);
 $("chatArea").scrollTop=$("chatArea").scrollHeight;
 return element;
}

/* NEW CHAT */
function newChat(){
 chatHistory=[];
 $("chatArea").innerHTML=`
  <div id="welcome">
   <h1>HOW CAN I HELP YOU?</h1>
   <p>Ask anything. Explore ideas. Create something amazing.</p>
  </div>`;
 $("menu").style.display="none";
 showStatus("New chat started");
}
$("newChatButton").onclick=newChat;
$("menuNewChat").onclick=newChat;

/* CLEAR CHAT */
$("menuClear").onclick=()=>{
 if(confirm("Do you want to clear this chat?")){
  newChat();
 }
};

/* REAL AI CONNECTION */
async function sendMessage(){

 const message=$("prompt").value.trim();

 if(!message||busy)return;

 busy=true;
 $("sendButton").disabled=true;

 $("welcome")?.remove();

 addMessage(message,"user");

 $("prompt").value="";
 const typing=addMessage(
  "AXON AI is thinking...","ai typing"
 );

 showStatus("Connecting to AXON AI...");

 try{

  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    message:message,
    history:chatHistory
   })
  });

  const raw=await response.text();
  let data;

  try{
   data=JSON.parse(raw);
  }catch{
   throw new Error(
    "Server returned invalid response: "+
    raw.slice(0,150)
   );
  }

  if(!response.ok){
   throw new Error(
    data.error||"AI server request failed."
   );
  }

  const reply=
   data.reply||data.response||data.answer;

  if(!reply){
   throw new Error("AI response was empty.");
  }

  typing.className="message ai";
  typing.textContent=reply;

  chatHistory.push(
   {role:"user",content:message},
   {role:"assistant",content:reply}
  );

  showStatus("AXON AI Ready");

 }catch(error){

  typing.className="message ai";
  typing.textContent=
   "Sorry, AI response nahi aa paya.\n"+
   error.message;

  showStatus("Connection Error");
  console.error(error);

 }finally{

  busy=false;
  $("sendButton").disabled=false;
  $("prompt").focus();

 }
}

$("sendButton").onclick=sendMessage;

/* ENTER TO SEND */
$("prompt").addEventListener("keydown",event=>{
 if(event.key==="Enter"&&!event.shiftKey){
  event.preventDefault();
  sendMessage();
 }
});

/* AUTO TEXTAREA HEIGHT */
$("prompt").addEventListener("input",()=>{
 $("prompt").style.height="auto";
 $("prompt").style.height=
  Math.min($("prompt").scrollHeight,140)+"px";
});

/* FILE SELECTION */
$("attachButton").onclick=()=>{
 $("fileInput").click();
};

$("fileInput").onchange=()=>{
 const file=$("fileInput").files[0];
 if(file){
  addMessage("Selected file: "+file.name,"user");
  showStatus(
   "File selected. Backend upload support is required to send it to AI."
  );
 }
};

/* MICROPHONE */
$("micButton").onclick=()=>{
 const SpeechRecognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  showStatus("Voice input is not supported.");
  return;
 }

 const recognition=new SpeechRecognition();
 recognition.lang="hi-IN";
 recognition.interimResults=false;

 recognition.onstart=()=>{
  showStatus("Listening...");
 };

 recognition.onresult=event=>{
  $("prompt").value+=
   event.results[0][0].transcript;
  $("prompt").focus();
  showStatus("Voice input ready.");
 };

 recognition.onerror=()=>{
  showStatus("Microphone error.");
 };

 recognition.onend=()=>{
  if($("status").textContent==="Listening..."){
   showStatus("AXON AI Ready");
  }
 };

 recognition.start();
};

/* OPTIONAL HEALTH CHECK */
async function checkServer(){
 try{
  const response=await fetch("/api/health");
  if(response.ok){
   showStatus("AXON AI Server Connected");
  }
 }catch(error){
  showStatus("AI server status unavailable");
 }
}

checkServer();

</script>
</body>
</html>

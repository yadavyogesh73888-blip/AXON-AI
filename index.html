
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>AXON AI — Advanced AI Solutions</title>

<style>
:root {
  --bg:#07111f;
  --panel:#0d1c2e;
  --line:#25425d;
  --text:#f2f7ff;
  --muted:#91a9c1;
  --cyan:#46e0d3;
  --blue:#4c83ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 0%, #172b49 0%, #090f1d 55%, #060a13 100%);
  color:var(--text);
  font-family:Inter, Arial, sans-serif;
}
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

  #splash{
  position:fixed;
  inset:0;
  z-index:100;
  background:#030812;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:.4s;
}

#splash.done{
  opacity:0;
  visibility:hidden;
}
  font-size:38px;
  font-weight:900;
  letter-spacing:7px;
  color:var(--cyan);
  text-shadow:0 0 25px #00d5d5;
}
.loader{
  width:170px;
  height:4px;
  background:#193047;
  border-radius:10px;
  margin-top:25px;
  overflow:hidden;
}
.loader:after{
  content:"";
  display:block;
  width:40%;
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  animation:load 1s infinite alternate;
}
@keyframes load{to{transform:translateX(150px)}}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  padding:15px 0;
}
.brand{
  font-size:23px;
  font-weight:bold;
  letter-spacing:3px;
  color:var(--cyan);
}
button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  color:white;
  background:linear-gradient(110deg,#3159c9,#078e9d);
}
.secondary{
  background:#18314a;
  border:1px solid var(--line);
  }.panel{
  background:linear-gradient(145deg,#111f35,#0a1425);
  border:1px solid rgba(90,140,190,.22);
  border-radius:22px;
  padding:30px;
  margin-top:30px;
  box-shadow:0 18px 55px rgba(0,0,0,.35);
  backdrop-filter:blur(18px);
  transition:all .3s ease;
}

.panel h2{
  color:#f5f8ff;
  font-size:26px;
  font-weight:700;
  letter-spacing:.3px;
}

.panel .small{
  color:#9aafc8;
}
h2{margin-top:0}
input,textarea{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid var(--line);
  background:#071522;
  color:white;
  outline:none;
}
input:focus,textarea:focus{border-color:var(--cyan)}
.actions{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:22px;
}

.actions button{
  width:100%;
  min-height:50px;
  padding:14px 18px;
  border:1px solid #294765;
  border-radius:13px;
  background:linear-gradient(135deg,#12304d,#0c2035);
  color:#f5f8ff;
  font-size:15px;
  font-weight:600;
  letter-spacing:.3px;
  cursor:pointer;
  transition:all .2s ease;
}

.actions button:hover{
  border-color:var(--cyan);
  background:linear-gradient(135deg,#17466b,#10304d);
  transform:translateY(-2px);
}

.actions button:active{
  transform:scale(.98);
}

.actions button.secondary{
  background:#0a1929;
  border-color:#29415a;
}

.actions button.secondary:hover{
  background:#122941;
  border-color:var(--cyan);
}

#status{
  color:var(--muted);
  font-size:13px;
  margin-top:16px;
  overflow-wrap:anywhere;
  text-align:center;
}
#chat{
  display:none;
  margin-top:20px;
}
#messages{
  height:52vh;
  min-height:250px;
  overflow-y:auto;
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#081625;
}
.message{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  max-width:85%;
}
.user{
  background:#244777;
  margin-left:auto;
}
.ai{
  background:#142b40;
  border:1px solid #25445d;
}
.composer{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.composer textarea{
  resize:vertical;
  min-height:48px;
  max-height:120px;
  margin:0;
}
.small{
  color:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<div id="splash">
  <div class="logo">AXON AI</div>
  <div class="loader"></div>
  <p class="small">ADVANCED AI SOLUTIONS</p>
</div>

<div class="container">
<header>
  <div class="brand">AXON AI</div>
  <button id="logoutBtn" class="secondary hidden">Logout</button>
</header>

<section id="authPanel" class="panel">
  <h2>Welcome to AXON AI</h2>
  <p class="small">Login or create your account to continue.</p>

  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">

  <div class="actions">
    <button id="loginBtn">Login</button>
    <button id="signupBtn" class="secondary">Create Account</button>
    <button id="googleBtn" class="secondary">Google Sign In</button>
    <button id="forgotBtn" class="secondary">Forgot Password</button>
  </div>

  <p id="status">Connecting to Firebase...</p>
</section>

<section id="chat" class="panel">
  <h2>AXON AI Chat</h2>
  <p class="small" id="welcomeUser"></p>

  <div class="actions">
    <button id="newChatBtn" class="secondary">＋ New Chat</button>
  </div>

  <div id="messages">
    <div class="message ai">Hello! I am AXON AI. How can I help you?</div>
  </div>

  <div class="composer">
    <textarea id="prompt" placeholder="Message AXON AI..."></textarea>
    <button id="sendBtn">➤</button>
  </div>
  <p class="small">AXON AI Assistant</p>
</section>
</div>

<script>
/* Splash backup: Firebase load fail hone par bhi screen nahi atkegi */
const splash = document.getElementById("splash");
const authPanel = document.getElementById("authPanel");
const statusText = document.getElementById("status");

const splashTimer = setTimeout(() => {
  splash.classList.add("done");
  statusText.textContent =
    "Firebase load nahi hua. Page refresh karke dobara try karein.";
}, 12000);

function hideSplash(){
  clearTimeout(splashTimer);
  splash.classList.add("done");
}

function showStatus(message){
  statusText.textContent = message;
}
</script>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail,
  signOut
} from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* AXON AI FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyA-YnGuAr8BdGt8xbo0Eq06lijQEPoeTC8",
  authDomain: "axon-ai-9ee3b.firebaseapp.com",
  projectId: "axon-ai-9ee3b",
  storageBucket: "axon-ai-9ee3b.firebasestorage.app",
  messagingSenderId: "304665322304",
  appId: "1:304665322304:web:b409df4442f3cf018710a5",
  measurementId: "G-NBP2KRZWSG"
};

let auth;

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");
const googleBtn = document.getElementById("googleBtn");
const forgotBtn = document.getElementById("forgotBtn");
const logoutBtn = document.getElementById("logoutBtn");
const chat = document.getElementById("chat");
const messages = document.getElementById("messages");
const promptInput = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

function getEmail(){
  return emailInput.value.trim();
}

function getPassword(){
  return passwordInput.value;
}

function showError(error){
  console.error("AXON ERROR:", error);
  showStatus(error.message || "Something went wrong.");
}

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);

  await setPersistence(auth, browserLocalPersistence);

  onAuthStateChanged(auth, user => {
    hideSplash();

    if(user){
      authPanel.classList.add("hidden");
      chat.style.display = "block";
      logoutBtn.classList.remove("hidden");
      document.getElementById("welcomeUser").textContent =
        "Logged in: " + (user.email || "Google user");
      showStatus("Firebase connected.");
    }else{
      authPanel.classList.remove("hidden");
      chat.style.display = "none";
      logoutBtn.classList.add("hidden");
      showStatus("Please login to continue.");
    }
  });

} catch(error) {
  hideSplash();
  showStatus("Firebase error: " + error.message);
  console.error(error);
}

loginBtn.addEventListener("click", async () => {
  try {
    if(!auth) throw new Error("Firebase is not ready.");
    await signInWithEmailAndPassword(
      auth,getEmail(),getPassword()
    );
  } catch(error){ showError(error); }
});

signupBtn.addEventListener("click", async () => {
  try {
    if(!auth) throw new Error("Firebase is not ready.");
    await createUserWithEmailAndPassword(
      auth,getEmail(),getPassword()
    );
    showStatus("Account created successfully.");
  } catch(error){ showError(error); }
});

googleBtn.addEventListener("click", async () => {
  try {
    if(!auth) throw new Error("Firebase is not ready.");
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth,provider);
  } catch(error){ showError(error); }
});

forgotBtn.addEventListener("click", async () => {
  try {
    if(!auth) throw new Error("Firebase is not ready.");
    if(!getEmail()) throw new Error("Pehle email address likhein.");
    await sendPasswordResetEmail(auth,getEmail());
    showStatus("Password reset email sent.");
  } catch(error){ showError(error); }
});

logoutBtn.addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch(error){ showError(error); }
});

document.getElementById("newChatBtn").addEventListener("click", () => {
  messages.innerHTML =
    '<div class="message ai">New chat started. How can I help?</div>';
});

function addMessage(text,type){
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage(){
  const prompt = promptInput.value.trim();
  if(!prompt || !auth?.currentUser) return;

  promptInput.value = "";
  addMessage(prompt,"user");

  const loading = addMessage("AXON AI is thinking...","ai");
  sendBtn.disabled = true;

  try {
    const token = await auth.currentUser.getIdToken();

    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + token
      },
      body:JSON.stringify({message:prompt})
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.message || data.error || "AI server error: " + response.status);
    }

    loading.textContent =
      data.reply || data.response || data.message ||
      "AI se response nahi mila.";

  } catch(error){
    loading.textContent = "Error: " + error.message;
    console.error("CHAT ERROR:",error);
  } finally {
    sendBtn.disabled = false;
    messages.scrollTop = messages.scrollHeight;
  }
}

sendBtn.addEventListener("click",sendMessage);

promptInput.addEventListener("keydown",event=>{
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

</script>

</body>
</html>

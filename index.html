<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050811">
<title>AXON AI — Next-Gen Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #050811;
    --bg-sidebar: #090e1a;
    --bg-card: rgba(17, 25, 43, 0.75);
    --bg-input: #0e1628;
    --bg-hover: rgba(59, 130, 246, 0.12);
    --border: rgba(255, 255, 255, 0.08);
    --border-focus: #3b82f6;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --accent: #06b6d4;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --danger: #ef4444;
    --success: #10b981;
    --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.6);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    background: var(--bg-main);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08), transparent 35%),
      radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.08), transparent 35%);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
  }

  button, input, textarea {
    font: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
    border: none;
    background: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .hidden { display: none !important; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

  .icon {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    flex-shrink: 0;
  }

  /* SPLASH */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: var(--bg-main);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .logo-box {
    width: 90px;
    height: 90px;
    border-radius: 26px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.2));
    border: 1px solid rgba(59, 130, 246, 0.4);
    display: grid;
    place-items: center;
    box-shadow: 0 0 50px rgba(59, 130, 246, 0.35), inset 0 0 20px rgba(59, 130, 246, 0.2);
    animation: pulseGlow 2s infinite alternate;
  }

  .logo-box svg {
    width: 44px;
    height: 44px;
    color: #60a5fa;
  }

  @keyframes pulseGlow {
    from { transform: scale(0.98); box-shadow: 0 0 30px rgba(59, 130, 246, 0.25); }
    to { transform: scale(1.03); box-shadow: 0 0 60px rgba(6, 182, 212, 0.45); }
  }

  #splash h1 {
    margin-top: 24px;
    letter-spacing: 6px;
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(90deg, #fff, #93c5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #splash p {
    margin-top: 10px;
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  .loader {
    width: 180px;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    margin-top: 28px;
    overflow: hidden;
  }

  .loader:after {
    content: "";
    display: block;
    width: 45%;
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 20px;
    animation: loadBar 1.1s infinite ease-in-out;
  }

  @keyframes loadBar {
    from { transform: translateX(-100%); }
    to { transform: translateX(250%); }
  }

  /* AUTH */
  #auth {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #auth.active { display: flex; }

  .auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 32px;
    box-shadow: var(--shadow-lg);
  }

  .brand {
    text-align: center;
    margin-bottom: 24px;
  }

  .brand-badge {
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: grid;
    place-items: center;
    box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
  }

  .brand h1 {
    font-size: 24px;
    letter-spacing: 3px;
    font-weight: 700;
  }

  .brand p {
    color: var(--text-muted);
    margin-top: 6px;
    font-size: 13px;
  }

  .google-btn {
    width: 100%;
    padding: 13px 16px;
    background: #ffffff;
    color: #0f172a;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    margin-top: 16px;
  }

  .google-btn:hover {
    background: #f1f5f9;
    transform: translateY(-1px);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .tabs {
    display: flex;
    gap: 6px;
    background: rgba(5, 8, 17, 0.6);
    padding: 5px;
    border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 22px;
  }

  .tabs button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
  }

  .tabs button.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
  }

  .auth-form { display: none; }
  .auth-form.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 13px;
    font-weight: 500;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap .icon {
    position: absolute;
    left: 14px;
    color: var(--text-muted);
    pointer-events: none;
  }

  .field input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  .primary-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--primary), #2563eb);
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
  }

  .primary-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
  }

  .auth-message {
    text-align: center;
    min-height: 20px;
    margin-top: 14px;
    font-size: 13px;
    color: #f87171;
  }

  /* MAIN APP */
  #app {
    display: none;
    min-height: 100vh;
  }

  #app.active { display: flex; }

  .sidebar {
    width: 280px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
    transition: transform 0.3s ease;
  }

  .side-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px 10px;
  }

  .side-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
  }

  .side-brand span {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: grid;
    place-items: center;
  }

  .new-chat-btn {
    width: 100%;
    padding: 12px 14px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(6, 182, 212, 0.12));
    border: 1px solid rgba(59, 130, 246, 0.35);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    color: #93c5fd;
  }

  .new-chat-btn:hover {
    background: rgba(59, 130, 246, 0.25);
    color: #fff;
  }

  .search-box {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-box .icon {
    position: absolute;
    left: 12px;
    width: 15px;
    height: 15px;
    color: var(--text-muted);
  }

  #historySearch {
    width: 100%;
    padding: 10px 12px 10px 34px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }

  #historySearch:focus { border-color: var(--primary); }

  .history-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 6px 8px 0;
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .history-row {
    display: flex;
    align-items: center;
    border-radius: 10px;
    transition: background 0.2s;
  }

  .history-row:hover { background: rgba(255, 255, 255, 0.05); }
  .history-row.active { background: var(--bg-hover); border: 1px solid rgba(59, 130, 246, 0.25); }

  .history-item {
    flex: 1;
    padding: 10px 12px;
    text-align: left;
    font-size: 13px;
    color: #cbd5e1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .history-row.active .history-item { color: #fff; font-weight: 500; }

  .del-chat-btn {
    padding: 8px;
    color: var(--text-muted);
    opacity: 0;
    border-radius: 8px;
  }

  .history-row:hover .del-chat-btn { opacity: 1; }
  .del-chat-btn:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

  .side-bottom {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 12px;
    margin-bottom: 6px;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 14px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .user-meta { overflow: hidden; }

  #profileName {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-status {
    font-size: 11px;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .user-status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  .side-nav-btn {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .side-nav-btn:hover {
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
  }

  .side-nav-btn.danger:hover {
    background: rgba(239, 68, 68, 0.12);
    color: #fca5a5;
  }

  /* MAIN CHAT */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
  }

  .header {
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(5, 8, 17, 0.78);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .model-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .model-badge span {
    font-size: 10px;
    padding: 2px 6px;
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
    border-radius: 6px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    padding: 9px 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #cbd5e1;
  }

  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.09);
    color: #fff;
  }

  #messages {
    flex: 1;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 20px 180px;
    display: flex;
    flex-direction: column;
  }

  .welcome {
    margin: auto 0;
    text-align: center;
    padding: 40px 10px;
    animation: fadeIn 0.4s ease;
  }

  .welcome-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.2));
    border: 1px solid rgba(59, 130, 246, 0.35);
    display: grid;
    place-items: center;
    color: #60a5fa;
  }

  .welcome h1 {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .welcome p {
    color: var(--text-muted);
    margin-top: 10px;
    font-size: 15px;
  }

  .suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 620px;
    margin: 32px auto 0;
    text-align: left;
  }

  .suggestion-card {
    padding: 15px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .suggestion-card:hover {
    border-color: rgba(59, 130, 246, 0.45);
    background: rgba(30, 41, 59, 0.8);
    transform: translateY(-2px);
  }

  .suggestion-card strong { font-size: 13px; color: #e2e8f0; }
  .suggestion-card span { font-size: 12px; color: var(--text-muted); }

  .message-row {
    display: flex;
    gap: 14px;
    margin: 14px 0;
    animation: fadeIn 0.25s ease;
  }

  .message-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    margin-top: 2px;
    overflow: hidden;
  }

  .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .message-row.ai .msg-avatar {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
  }

  .message-row.user .msg-avatar {
    background: #1e293b;
    border: 1px solid var(--border);
    color: #93c5fd;
    font-weight: 600;
    font-size: 13px;
  }

  .message {
    max-width: 82%;
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.65;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .message-row.user .message {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
  }

  .message-row.ai .message {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .message-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }

  .message-actions button {
    padding: 5px 9px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.04);
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .message-actions button:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  /* COMPOSER */
  .composer {
    position: fixed;
    bottom: 0;
    left: 280px;
    right: 0;
    background: linear-gradient(to top, var(--bg-main) 75%, transparent);
    padding: 14px 20px 18px;
    z-index: 40;
  }

  .composer-inner {
    max-width: 820px;
    margin: 0 auto;
    position: relative;
  }

  .composer-box {
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 10px 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    transition: border-color 0.2s;
  }

  .composer-box:focus-within { border-color: var(--primary); }

  #attachmentInfo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #93c5fd;
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.3);
    padding: 5px 10px;
    border-radius: 8px;
    margin-bottom: 8px;
  }

  #attachmentInfo:empty { display: none; }

  .composer-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #chatInput {
    flex: 1;
    min-width: 0;
    resize: none;
    max-height: 150px;
    padding: 8px 4px;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 14.5px;
    line-height: 1.5;
    outline: none;
  }

  .attach-trigger {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.05);
    display: grid;
    place-items: center;
    color: var(--text-muted);
  }

  .attach-trigger:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  .send-btn {
    height: 38px;
    padding: 0 16px;
    background: var(--primary);
    border-radius: 11px;
    font-weight: 600;
    font-size: 13px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .send-btn:hover { background: var(--primary-hover); }
  .send-btn.stop { background: var(--danger); }

  .composer-tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }

  .tool-group { display: flex; gap: 6px; }

  .tool-btn {
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .tool-btn:hover {

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { 
    getAuth, 
    GoogleAuthProvider, 
    signInWithPopup, 
    signOut, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  // FIXED FIREBASE CONFIGURATION
  const firebaseConfig = {
    apiKey: "AIzaSyA-YnGuAr8BdGt8xbo0Eq06lijQEPoeTC8",
    authDomain: "axon-ai-9ee3b.firebaseapp.com",
    projectId: "axon-ai-9ee3b",
    storageBucket: "axon-ai-9ee3b.firebasestorage.app",
    messagingSenderId: "304665322304",
    appId: "1:304665322304:web:b409df4442f3cf018710a5",
    measurementId: "G-NBP2KRZWSG"
  };

  let fbAuth = null;
  let googleProvider = null;

  try {
    const fbApp = initializeApp(firebaseConfig);
    fbAuth = getAuth(fbApp);
    googleProvider = new GoogleAuthProvider();
  } catch (err) {
    console.warn("Firebase initialization error:", err);
  }

  const $ = id => document.getElementById(id);
  const splash = $("splash");
  const auth = $("auth");
  const app = $("app");
  const messages = $("messages");
  const chatInput = $("chatInput");
  const authMessage = $("authMessage");

  let currentUser = null;
  let currentChatId = null;
  let chats = [];
  let selectedFile = null;
  let controller = null;
  let recognition = null;
  let stopped = false;
  let toastTimer = null;

  function showToast(msg) {
    const toast = $("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
  }

  const readJSON = (key, fallback) => {
    try {
      return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch {
      return fallback;
    }
  };

  const getAccounts = () => readJSON("axon_accounts", []);
  const saveAccounts = accounts => localStorage.setItem("axon_accounts", JSON.stringify(accounts));
  const userKey = email => "axon_chats_" + email;

  function loadChats() {
    chats = readJSON(userKey(currentUser.email), []);
  }

  function saveChats() {
    localStorage.setItem(userKey(currentUser.email), JSON.stringify(chats));
  }

  $("googleSignInBtn").onclick = async () => {
    if (!fbAuth) {
      authMessage.textContent = "Firebase is not initialized properly.";
      return;
    }

    try {
      authMessage.textContent = "";
      const result = await signInWithPopup(fbAuth, googleProvider);
      const user = result.user;

      currentUser = {
        name: user.displayName || "Google User",
        email: user.email,
        photo: user.photoURL || null
      };

      sessionStorage.setItem("axon_session", JSON.stringify(currentUser));
      openApp();
      showToast("Signed in with Google as " + currentUser.name);
    } catch (error) {
      console.error(error);
      authMessage.textContent = error.message || "Google Sign-In failed.";
    }
  };

  async function hashPassword(password, salt) {
    const encoder = new TextEncoder();
    const key = await crypto.subtle.importKey(
      "raw", encoder.encode(password), "PBKDF2", false, ["deriveBits"]
    );
    const bits = await crypto.subtle.deriveBits({
      name: "PBKDF2",
      salt: encoder.encode(salt),
      iterations: 150000,
      hash: "SHA-256"
    }, key, 256);

    return Array.from(new Uint8Array(bits))
      .map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function showLogin() {
    $("loginTab").classList.add("active");
    $("signupTab").classList.remove("active");
    $("loginForm").classList.add("active");
    $("signupForm").classList.remove("active");
    authMessage.textContent = "";
  }

  function showSignup() {
    $("signupTab").classList.add("active");
    $("loginTab").classList.remove("active");
    $("signupForm").classList.add("active");
    $("loginForm").classList.remove("active");
    authMessage.textContent = "";
  }

  $("loginTab").onclick = showLogin;
  $("signupTab").onclick = showSignup;

  $("signupForm").addEventListener("submit", async event => {
    event.preventDefault();
    const name = $("signupName").value.trim();
    const email = $("signupEmail").value.trim().toLowerCase();
    const password = $("signupPassword").value;

    if (!name || !email || password.length < 8) {
      authMessage.textContent = "Please enter valid details (min. 8 char password).";
      return;
    }

    const accounts = getAccounts();
    if (accounts.some(a => a.email === email)) {
      authMessage.textContent = "This email is already registered.";
      return;
    }

    try {
      const salt = crypto.randomUUID();
      const passwordHash = await hashPassword(password, salt);
      accounts.push({ name, email, salt, passwordHash });
      saveAccounts(accounts);

      currentUser = { name, email, photo: null };
      sessionStorage.setItem("axon_session", JSON.stringify(currentUser));
      $("signupForm").reset();
      openApp();
      showToast("Welcome to AXON AI, " + name + "!");
    } catch {
      authMessage.textContent = "Account creation failed. Try again.";
    }
  });

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    const email = $("loginEmail").value.trim().toLowerCase();
    const password = $("loginPassword").value;

    const account = getAccounts().find(a => a.email === email);
    if (!account) {
      authMessage.textContent = "Incorrect email or password.";
      return;
    }

    try {
      const hash = await hashPassword(password, account.salt);
      if (hash !== account.passwordHash) {
        authMessage.textContent = "Incorrect email or password.";
        return;
      }

      currentUser = { name: account.name, email: account.email, photo: null };
      sessionStorage.setItem("axon_session", JSON.stringify(currentUser));
      $("loginForm").reset();
      openApp();
      showToast("Signed in as " + account.name);
    } catch {
      authMessage.textContent = "Login failed. Please try again.";
    }
  });

  function openApp() {
    auth.classList.remove("active");
    splash.style.display = "none";
    app.classList.add("active");

    $("profileName").textContent = currentUser.name;
    const avatarEl = $("userAvatar");
    if (currentUser.photo) {
      avatarEl.innerHTML = `<img src="${currentUser.photo}" alt="Avatar">`;
    } else {
      avatarEl.textContent = currentUser.name.charAt(0).toUpperCase();
    }

    loadChats();

    if (chats.length > 0) {
      currentChatId = chats[0].id;
      renderHistory();
      renderMessages();
    } else {
      newChat();
    }
  }

  async function logout() {
    if (fbAuth) {
      try { await signOut(fbAuth); } catch {}
    }
    sessionStorage.removeItem("axon_session");
    currentUser = null;
    currentChatId = null;
    chats = [];
    stopGeneration();

    app.classList.remove("active");
    auth.classList.add("active");
    showLogin();
    $("sidebar").classList.remove("open");
  }

  $("sideLogout").onclick = logout;
  $("headerLogout").onclick = logout;

  function startSplash() {
    const steps = [
      "Initializing Neural Interface...",
      "Loading Security Modules...",
      "Preparing Workspace...",
      "System Ready"
    ];
    let i = 0;
    const timer = setInterval(() => {
      $("splashText").textContent = steps[i++];
      if (i >= steps.length) {
        clearInterval(timer);
        setTimeout(() => {
          splash.style.display = "none";
          auth.classList.add("active");
        }, 350);
      }
    }, 550);
  }

  function newChat() {
    currentChatId = crypto.randomUUID();
    chats.unshift({
      id: currentChatId,
      title: "New Chat",
      messages: [],
      updated: Date.now()
    });
    saveChats();
    renderHistory();
    renderMessages();
    chatInput.focus();
  }

  function selectChat(id) {
    if (!chats.some(c => c.id === id)) return;
    currentChatId = id;
    renderHistory();
    renderMessages();
    $("sidebar").classList.remove("open");
  }

  function deleteChat(id, event) {
    event.stopPropagation();
    chats = chats.filter(c => c.id !== id);
    saveChats();
    if (currentChatId === id) {
      if (chats.length > 0) {
        currentChatId = chats[0].id;
      } else {
        newChat();
        return;
      }
    }
    renderHistory();
    renderMessages();
    showToast("Conversation deleted");
  }

  const currentChat = () => chats.find(c => c.id === currentChatId);

  function renderHistory() {
    const list = $("historyList");
    list.innerHTML = "";
    const query = $("historySearch").value.toLowerCase();

    chats.filter(c => c.title.toLowerCase().includes(query)).forEach(chat => {
      const row = document.createElement("div");
      row.className = "history-row" + (chat.id === currentChatId ? " active" : "");

      const button = document.createElement("button");
      button.className = "history-item";
      button.innerHTML = `<svg class="icon" style="width:14px;height:14px;opacity:0.7" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span></span>`;
      button.querySelector("span").textContent = chat.title;
      button.onclick = () => selectChat(chat.id);

      const delBtn = document.createElement("button");
      delBtn.className = "del-chat-btn";
      delBtn.title = "Delete chat";
      delBtn.innerHTML = `<svg class="icon" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>`;
      delBtn.onclick = e => deleteChat(chat.id, e);

      row.append(button, delBtn);
      list.appendChild(row);
    });
  }

  function renderMessages() {
    messages.innerHTML = "";
    const chat = currentChat();

    if (!chat || !chat.messages.length) {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.innerHTML = `
        <div class="welcome-icon">
          <svg class="icon" style="width:32px;height:32px" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1>How can I help you today?</h1>
        <p>Ask questions, write code, analyze documents, or brainstorm ideas.</p>
        <div class="suggestions">
          <button type="button" class="suggestion-card" data-prompt="Write a professional Python script to organize files by extension.">
            <strong>Write Clean Code</strong>
            <span>Generate a Python file organizer script</span>
          </button>
          <button type="button" class="suggestion-card" data-prompt="Explain Artificial Intelligence and Machine Learning in simple words.">
            <strong>Learn Concepts</strong>
            <span>Understand AI & Machine Learning simply</span>
          </button>
          <button type="button" class="suggestion-card" data-prompt="Draft a professional business email for a new project proposal.">
            <strong>Draft Emails</strong>
            <span>Create a polished project proposal email</span>
          </button>
          <button type="button" class="suggestion-card" data-prompt="Give me 5 creative startup ideas for 2026 using AI.">
            <strong>Brainstorm Ideas</strong>
            <span>Explore innovative AI startup concepts</span>
          </button>
        </div>
      `;

      welcome.querySelectorAll(".suggestion-card").forEach(card => {
        card.onclick = () => sendPrompt(card.dataset.prompt);
      });

      messages.appendChild(welcome);
      return;
    }

    chat.messages.forEach((item, index) => {
      addMessageElement(item.text, item.role, index);
    });
  }

  function addMessageElement(text, role, index) {
    const row = document.createElement("div");
    row.className = "message-row " + (role === "user" ? "user" : "ai");

    const avatar = document.createElement("div");
    avatar.className = "msg-avatar";
    if (role === "user") {
      if (currentUser && currentUser.photo) {
        avatar.innerHTML = `<img src="${currentUser.photo}" alt="U">`;
      } else {
        avatar.textContent = currentUser ? currentUser.name.charAt(0).toUpperCase() : "U";
      }
    } else {
      avatar.innerHTML = `<svg class="icon" style="width:17px;height:17px" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`;
    }

    const box = document.createElement("div");
    box.className = "message";

    const content = document.createElement("div");
    content.className = "msg-content";
    content.textContent = text;
    box.appendChild(content);

    if (role === "ai") {
      const actions = document.createElement("div");
      actions.className = "message-actions";

      const copy = document.createElement("button");
      copy.innerHTML = `<svg class="icon" style="width:12px;height:12px" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copy`;
      copy.onclick = () => copyText(content.textContent);

      const regenerate = document.createElement("button");
      regenerate.innerHTML = `<svg class="icon" style="width:12px;height:12px" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Regenerate`;
      regenerate.onclick = () => regenerateReply(index);

      actions.append(copy, regenerate);
      box.appendChild(actions);
    }

    row.append(avatar, box);
    messages.appendChild(row);
    return box;
  }

  function addMessage(text, role) {
    const chat = currentChat();
    if (!chat) return;

    if (chat.messages.length === 0) {
      messages.innerHTML = "";
    }

    chat.messages.push({ text, role });
    chat.updated = Date.now();

    if (role === "user" && chat.title === "New Chat") {
      chat.title = text.slice(0, 36);
    }

    saveChats();
    renderHistory();

    const box = addMessageElement(text, role, chat.messages.length - 1);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    return box;
  }

  $("sideNewChat").onclick = newChat;
  $("headerNewChat").onclick = newChat;
  $("menuBtn").onclick = () => $("sidebar").classList.toggle("open");
  $("historySearch").oninput = renderHistory;

  $("clearBtn").onclick = () => {
    const chat = currentChat();
    if (!chat) return;
    chat.messages = [];
    chat.title = "New Chat";
    saveChats();
    renderHistory();
    renderMessages();
    showToast("Chat cleared");
  };

  $("profileBtn").onclick = () => {
    showModal("Account Profile", `Name: ${currentUser.name}\nEmail: ${currentUser.email}\nPlan: AXON Pro Workspace`);
  };

  $("settingsBtn").onclick = () => {
    showModal("System Settings", "Model: AXON Core Pro 2.0\nAuth: Firebase Google + Email\nVoice Input: Hindi / English (hi-IN)");
  };

  function showModal(title, text) {
    $("modalTitle").textContent = title;
    $("modalText").textContent = text;
    $("modal").classList.add("active");
  }

  $("modalClose").onclick = () => $("modal").classList.remove("active");
  $("modal").onclick = e => {
    if (e.target === $("modal")) $("modal").classList.remove("active");
  };

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      showToast("Copied to clipboard");
    } catch {
      showToast("Unable to copy text");
    }
  }

  $("exportBtn").onclick = () => {
    const chat = currentChat();
    if (!chat || !chat.messages.length) {
      showToast("Nothing to export");
      return;
    }

    const content = chat.messages.map(m =>
      (m.role === "user" ? "YOU" : "AXON AI") + ":\n" + m.text
    ).join("\n\n----------------------------------------\n\n");

    const blob = new Blob([content], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${chat.title.replace(/[^a-z0-9]/gi, "_").toLowerCase() || "axon-chat"}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    showToast("Chat exported as .txt");
  };

  $("plusBtn").onclick = e => {
    e.stopPropagation();
    $("plusMenu").classList.toggle("hidden");
  };

  $("photoBtn").onclick = () => {
    $("fileInput").accept = "image/*";
    $("fileInput").click();
  };

  $("uploadBtn").onclick = () => {
    $("fileInput").accept = ".pdf,.txt,.doc,.docx,.csv";
    $("fileInput").click();
  };

  $("fileInput").onchange = event => {
    selectedFile = event.target.files[0] || null;
    const info = $("attachmentInfo");
    if (selectedFile) {
      info.innerHTML = `<span>📎 ${selectedFile.name}</span> <button type="button" id="removeFile" style="color:#f87171;font-weight:bold;margin-left:6px">✕</button>`;
      $("removeFile").onclick = () => {
        selectedFile = null;
        info.innerHTML = "";
        $("fileInput").value = "";
      };
    } else {
      info.innerHTML = "";
    }
    $("plusMenu").classList.add("hidden");
  };

  async function getAIResponse(prompt, signal) {
    if (signal && signal.aborted) {
      throw new DOMException("Stopped", "AbortError");
    }

    await new Promise(resolve => setTimeout(resolve, 700));
    return "AXON AI Core is online and ready. Connect your `/api/chat` backend endpoint inside `getAIResponse()` to receive live AI responses.";
  }

  function stopGeneration() {
    stopped = true;
    if (controller) {
      controller.abort();
      controller = null;
    }
    $("stopBtn").classList.add("hidden");
    $("sendBtn").classList.remove("hidden");
  }

  async function sendPrompt(prompt) {
    if (!prompt.trim()) return;
    stopped = false;

    addMessage(prompt, "user");
    const replyBox = addMessage("Thinking...", "ai");

    $("sendBtn").classList.add("hidden");
    $("stopBtn").classList.remove("hidden");

    controller = new AbortController();

    try {
      const response = await getAIResponse(prompt, controller.signal);

      if (!stopped) {
        const chat = currentChat();
        if (chat) {
          const lastMessage = chat.messages[chat.messages.length - 1];
          if (lastMessage && lastMessage.role === "ai") {
            lastMessage.text = response;
            saveChats();
          }
        }
        replyBox.querySelector(".msg-content").textContent = response;
      }
    } catch (error) {
      if (error.name === "AbortError") {
        replyBox.querySelector(".msg-content").textContent = "Generation stopped by user.";
      } else {
        replyBox.querySelector(".msg-content").textContent = "Connection error. Please try again.";
      }
    } finally {
      controller = null;
      stopped = false;
      $("stopBtn").classList.add("hidden");
      $("sendBtn").classList.remove("hidden");
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }
  }

  function autoResizeInput() {
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + "px";
  }

  chatInput.addEventListener("input", autoResizeInput);

  $("chatForm").addEventListener("submit", async event => {
    event.preventDefault();
    let prompt = chatInput.value.trim();

    if (selectedFile) {
      prompt += `\n[Attached File: ${selectedFile.name}]`;
    }
    if (!prompt) return;

    chatInput.value = "";
    autoResizeInput();
    selectedFile = null;
    $("attachmentInfo").innerHTML = "";
    $("fileInput").value = "";

    await sendPrompt(prompt);
  });

  $("stopBtn").onclick = stopGeneration;

  async function regenerateReply(index) {
    const chat = currentChat();
    if (!chat || index < 0 || index >= chat.messages.length) return;

    const previousMessage = chat.messages[index - 1];
    if (!previousMessage || previousMessage.role !== "user") return;

    const prompt = previousMessage.text;
    chat.messages.splice(index);
    saveChats();
    renderMessages();

    await sendPrompt(prompt);
  }

  $("voiceBtn").onclick = () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      showModal("Voice Not Supported", "Your browser does not support speech recognition.");
      return;
    }

    if (recognition) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "hi-IN";
    recognition.interimResults = false;
    recognition.continuous = false;

    $("voiceBtn").classList.add("listening");
    $("voiceLabel").textContent = "Listening...";

    recognition.onresult = event => {
      chatInput.value = event.results[0][0].transcript;
      autoResizeInput();
      chatInput.focus();
    };

    recognition.onerror = () => {
      showToast("Voice recognition failed");
    };

    recognition.onend = () => {
      $("voiceBtn").classList.remove("listening");
      $("voiceLabel").textContent = "Voice";
      recognition = null;
    };

    recognition.start();
  };

  chatInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      $("chatForm").requestSubmit();
    }
  });

  document.addEventListener("click", event => {
    const sidebar = $("sidebar");
    if (
      window.innerWidth <= 768 &&
      sidebar.classList.contains("open") &&
      !sidebar.contains(event.target) &&
      !$("menuBtn").contains(event.target)
    ) {
      sidebar.classList.remove("open");
    }

    if (!$("plusMenu").contains(event.target) && !$("plusBtn").contains(event.target)) {
      $("plusMenu").classList.add("hidden");
    }
  });

  function restoreSession() {
    const session = readJSON("axon_session", null);
    if (session && typeof session.name === "string" && typeof session.email === "string") {
      currentUser = {
        name: session.name,
        email: session.email,
        photo: session.photo || null
      };
      openApp();
      return true;
    }
    return false;
  }

  if (fbAuth) {
    onAuthStateChanged(fbAuth, user => {
      if (user && !currentUser) {
        currentUser = {
          name: user.displayName || "Google User",
          email: user.email,
          photo: user.photoURL || null
        };
        sessionStorage.setItem("axon_session", JSON.stringify(currentUser));
        openApp();
      }
    });
  }

  if (!restoreSession()) {
    startSplash();
  }
</script>
</body>
</html>

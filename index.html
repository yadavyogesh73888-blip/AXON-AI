
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>AXON AI</title>

<style>
:root{
  --bg:#07111f;
  --panel:#10243a;
  --line:#29445f;
  --text:#f2f7ff;
  --muted:#91a9c1;
  --cyan:#46e0d3;
  --blue:#318ce7;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%,#172b49 0%,#090f1d 55%,#060a13 100%);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

button,textarea{font:inherit}
button{cursor:pointer;color:white}
button:focus-visible,textarea:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:3px;
}

/* SPLASH SCREEN */

#splash{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#030812;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .5s,visibility .5s;
}

#splash.done{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.splash-image{
  width:250px;
  height:250px;
  max-width:80vw;
  max-height:80vw;
  object-fit:contain;
  animation:logoEnter 1s ease;
}

@keyframes logoEnter{
  from{opacity:0;transform:scale(.85)}
  to{opacity:1;transform:scale(1)}
}

/* MAIN APP */

.app{
  width:100%;
  height:100%;
  max-width:1200px;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding:0 24px;
}

/* HEADER */

header{
  height:65px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #29445f;
}

.header-btn{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  color:#eaf4ff;
  font-size:25px;
  transition:.2s;
}

.header-btn:hover{
  background:#142b40;
  border-color:#29445f;
}

.dots{
  font-size:27px;
  letter-spacing:2px;
  padding-bottom:12px;
}

.new-chat-icon{
  font-size:23px;
}

/* CHAT AREA */

#chat{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

#messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:20px 5px;
  scrollbar-width:thin;
  scrollbar-color:#29445f transparent;
}

.welcome{
  position:absolute;
  top:39%;
  left:0;
  right:0;
  transform:translateY(-50%);
  text-align:center;
  padding:15px;
  pointer-events:none;
}

.welcome h1{
  margin:0 0 10px;
  font-size:clamp(21px,4vw,29px);
  font-weight:750;
  letter-spacing:1px;
  color:#f2f7ff;
}

.welcome p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

.message{
  width:fit-content;
  max-width:min(82%,700px);
  padding:13px 17px;
  margin:14px 0;
  border-radius:17px;
  font-size:15px;
  line-height:1.65;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.user{
  margin-left:auto;
  background:linear-gradient(135deg,#244777,#1b3762);
  border:1px solid #355b91;
  border-bottom-right-radius:5px;
}

.ai{
  margin-right:auto;
  background:#142b40;
  border:1px solid #25445d;
  border-bottom-left-radius:5px;
}

/* COMPOSER */

.composer-area{
  flex:none;
  padding:12px 0 13px;
  background:transparent;
}

.composer{
  width:100%;
  border:1px solid #31516c;
  border-radius:23px;
  background:#10243a;
  padding:12px 14px 10px;
  box-shadow:0 8px 30px #0003;
  transition:border-color .2s,box-shadow .2s;
}

.composer:focus-within{
  border-color:#4389c0;
  box-shadow:0 0 0 2px #318ce71c;
}

#prompt{
  display:block;
  width:100%;
  min-height:43px;
  max-height:130px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:white;
  padding:9px 3px;
  font-size:15px;
  line-height:1.5;
}

#prompt::placeholder{
  color:#91a9c1;
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-top:7px;
}

.composer-left,
.composer-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.tool-btn{
  width:39px;
  height:39px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  color:#dcecff;
  font-size:23px;
  transition:.2s;
}

.tool-btn:hover{
  background:#1a3650;
  border-color:#31516c;
}

.ask-label{
  font-size:14px;
  font-weight:750;
  letter-spacing:.5px;
  color:#f2f7ff;
  white-space:nowrap;
}

#sendBtn{
  width:41px;
  height:41px;
  flex:none;
  display:grid;
  place-items:center;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#438cf2,#2467cf);
  color:white;
  font-size:21px;
  transition:.2s;
}

#sendBtn:hover{
  filter:brightness(1.15);
  transform:translateY(-1px);
}

#sendBtn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.footer-note{
  text-align:center;
  color:#718ba4;
  font-size:11px;
  margin:10px 0 0;
}

/* ATTACHMENT */

#fileInput{display:none}

#fileName{
  display:none;
  color:var(--cyan);
  font-size:12px;
  padding:5px 3px;
}

/* MOBILE */

@media(max-width:600px){

  .app{
    padding:0 13px;
  }

  header{
    height:57px;
  }

  .header-btn{
    width:40px;
    height:40px;
  }

  #messages{
    padding:12px 2px;
  }

  .welcome{
    top:39%;
    padding:12px 5px;
  }

  .welcome h1{
    font-size:22px;
  }

  .welcome p{
    font-size:12px;
  }

  .message{
    max-width:90%;
    font-size:14px;
    padding:12px 14px;
  }

  .composer-area{
    padding:8px 0 10px;
  }

  .composer{
    padding:10px 10px 8px;
    border-radius:20px;
  }

  #prompt{
    min-height:40px;
    font-size:14px;
  }

  .composer-left,
  .composer-right{
    gap:7px;
  }

  .tool-btn{
    width:36px;
    height:36px;
  }

  .ask-label{
    font-size:12px;
  }

  #sendBtn{
    width:38px;
    height:38px;
  }

  .footer-note{
    font-size:10px;
  }
}
</style>
</head>

<body>

<!-- SPLASH SCREEN -->

<div id="splash">
  <img
    src="/IMG_20261114_073941.png"
    alt="AXON AI"
    class="splash-image"
  >
</div>

<!-- MAIN APP -->

<div class="app">

  <!-- HEADER -->

  <header>

    <!-- LEFT THREE DOTS -->

    <button
      class="header-btn dots"
      type="button"
      aria-label="More options"
    >•••</button>

    <!-- RIGHT NEW CHAT -->

    <button
      class="header-btn new-chat-icon"
      id="newChatBtn"
      type="button"
      aria-label="New Chat"
      title="New Chat"
    >✎</button>

  </header>

  <!-- CHAT AREA -->

  <main id="chat">

    <div id="messages"></div>

    <!-- WELCOME TEXT -->

    <div class="welcome" id="welcome">
      <h1>HOW CAN I HELP YOU?</h1>
      <p>Ask anything. AXON AI is here to help.</p>
    </div>

  </main>

  <!-- MESSAGE BOX -->

  <section class="composer-area">

    <div class="composer">

      <textarea
        id="prompt"
        rows="1"
        placeholder="Message AXON AI..."
        aria-label="Message AXON AI"
      ></textarea>

      <div id="fileName"></div>

      <div class="composer-bottom">

        <!-- LEFT SIDE -->

        <div class="composer-left">

          <button
            class="tool-btn"
            id="attachBtn"
            type="button"
            aria-label="Attach file"
            title="Attach file"
          >+</button>

          <span class="ask-label">ASK AXON AI</span>

        </div>

        <!-- RIGHT SIDE -->

        <div class="composer-right">

          <button
            class="tool-btn"
            id="micBtn"
            type="button"
            aria-label="Microphone"
            title="Microphone"
          >
            <svg width="22" height="22"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linecap="round"
                 stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
              <path d="M12 19v3M8 22h8"/>
            </svg>
          </button>

          <button
            id="sendBtn"
            type="button"
            aria-label="Send message"
            title="Send"
          >
            ➤
          </button>

        </div>

      </div>

      <input type="file" id="fileInput">

    </div>

    <p class="footer-note">
      AXON AI can make mistakes. Check important information.
    </p>

  </section>

</div>

<!-- FRONTEND ONLY JAVASCRIPT -->

<script>

/* SPLASH SCREEN */

const splash = document.getElementById("splash");

window.addEventListener("load",()=>{
  setTimeout(()=>{
    splash.classList.add("done");
  },1500);
});

/* ELEMENTS */

const promptInput = document.getElementById("prompt");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const sendBtn = document.getElementById("sendBtn");

/* ADD MESSAGE */

function addMessage(text,type){

  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;

  return div;
}

/* SEND MESSAGE - UI PREVIEW ONLY */

function sendMessage(){

  const text = promptInput.value.trim();

  if(!text) return;

  welcome.style.display = "none";

  addMessage(text,"user");

  promptInput.value = "";
  promptInput.style.height = "auto";

  // No AI server or API connection.
  addMessage(
    "Message displayed successfully. AI response service is not connected in this UI-only version.",
    "ai"
  );
}

/* SEND BUTTON */

sendBtn.addEventListener("click",sendMessage);

/* ENTER TO SEND */

promptInput.addEventListener("keydown",event=>{

  if(event.key === "Enter" && !event.shiftKey){

    event.preventDefault();

    sendMessage();
  }

});

/* AUTO RESIZE TEXTAREA */

promptInput.addEventListener("input",()=>{

  promptInput.style.height = "auto";

  promptInput.style.height =
    Math.min(promptInput.scrollHeight,130) + "px";

});

/* NEW CHAT */

document.getElementById("newChatBtn").addEventListener("click",()=>{

  messages.innerHTML = "";

  welcome.style.display = "block";

  promptInput.value = "";
  promptInput.style.height = "auto";

  promptInput.focus();

});

/* ATTACHMENT BUTTON */

const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");

document.getElementById("attachBtn").addEventListener("click",()=>{
  fileInput.click();
});

fileInput.addEventListener("change",()=>{

  if(fileInput.files.length){

    fileName.textContent =
      "Selected: " + fileInput.files[0].name;

    fileName.style.display = "block";
  }

});

/* MIC BUTTON - UI PLACEHOLDER */

document.getElementById("micBtn").addEventListener("click",()=>{

  alert("Voice input is not connected in this UI-only version.");

});

</script>

</body>
</html>

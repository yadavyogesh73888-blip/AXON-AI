<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>AXON AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #080b14;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080b14;
    }

    .splash-logo {
      width: 85px;
      height: 85px;
      display: grid;
      place-items: center;
      border: 2px solid #4d8dff;
      border-radius: 25px;
      color: #66a3ff;
      font-size: 38px;
      font-weight: bold;
      box-shadow: 0 0 35px #2878ff55;
    }

    .splash h1 {
      margin-top: 20px;
      font-size: 30px;
      letter-spacing: 5px;
    }

    .splash p {
      margin-top: 12px;
      color: #8d9bb5;
      font-size: 13px;
    }

    .loader {
      width: 160px;
      height: 4px;
      margin-top: 30px;
      overflow: hidden;
      border-radius: 10px;
      background: #202b40;
    }

    .loader::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: #438cff;
      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes loading {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }

    .auth-screen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-screen.active {
      display: flex;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border: 1px solid #26344d;
      border-radius: 22px;
      background: #111a2b;
      box-shadow: 0 15px 60px #0008;
    }

    .auth-brand {
      margin-bottom: 25px;
      text-align: center;
    }

    .auth-brand h1 {
      color: #65a2ff;
      font-size: 30px;
      letter-spacing: 3px;
    }

    .auth-brand p {
      margin-top: 8px;
      color: #9baac2;
      font-size: 13px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      padding: 5px;
      border-radius: 12px;
      background: #080f1d;
    }

    .auth-tabs button {
      flex: 1;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #9baac2;
    }

    .auth-tabs button.active {
      background: #286de0;
      color: #fff;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #c5d1e5;
      font-size: 13px;
    }

    .field input {
      width: 100%;
      padding: 14px;
      border: 1px solid #30415e;
      border-radius: 10px;
      outline: none;
      background: #091222;
      color: #fff;
    }

    .field input:focus {
      border-color: #438cff;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #347ef0;
      color: #fff;
      font-weight: bold;
    }

    .primary-btn:hover {
      background: #2468d4;
    }

    .auth-message {
      min-height: 20px;
      margin-top: 15px;
      color: #ff8e8e;
      font-size: 13px;
      text-align: center;
    }

    .chat-screen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .chat-screen.active {
      display: flex;
    }

    .chat-header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #26344d;
      background: #101827;
    }

    .chat-header h2 {
      color: #65a2ff;
      letter-spacing: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-actions button,
    .icon-btn {
      padding: 9px 12px;
      border: 1px solid #30415e;
      border-radius: 9px;
      background: #17243a;
      color: #fff;
    }

    .chat-messages {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 18px 120px;
    }

    .welcome {
      margin-top: 80px;
      text-align: center;
    }

    .welcome h1 {
      font-size: 30px;
    }

    .welcome p {
      margin-top: 12px;
      color: #9baac2;
    }

    .message {
      max-width: 85%;
      margin: 15px 0;
      padding: 14px 16px;
      border-radius: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.user {
      margin-left: auto;
      background: #245db5;
    }

    .message.ai {
      margin-right: auto;
      border: 1px solid #26344d;
      background: #111c2e;
    }

    .chat-input-area {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 15px;
      border-top: 1px solid #26344d;
      background: #0c1422;
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .chat-input-row input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #30415e;
      border-radius: 12px;
      outline: none;
      background: #111c2e;
      color: #fff;
    }

    .send-btn {
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: #347ef0;
      color: #fff;
      font-weight: bold;
    }

    .chat-tools {
      display: flex;
      gap: 8px;
      max-width: 900px;
      margin: 10px auto 0;
    }

    .chat-tools button {
      padding: 8px 12px;
      border: 1px solid #30415e;
      border-radius: 8px;
      background: #17243a;
      color: #c5d1e5;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .auth-card {
        padding: 23px;
      }

      .chat-header {
        padding: 0 12px;
      }

      .chat-header h2 {
        font-size: 19px;
      }

      .message {
        max-width: 95%;
      }
    }
  </style>
</head>

<body>

  <!-- SPLASH SCREEN -->
  <main class="splash" id="splashScreen">
    <div class="splash-logo">A</div>
    <h1>AXON AI</h1>
    <p id="loadingText">Initializing Experience</p>
    <div class="loader"></div>
  </main>

  <!-- LOGIN / SIGNUP -->
  <section class="auth-screen" id="authScreen">
    <div class="auth-card">

      <div class="auth-brand">
        <h1>AXON AI</h1>
        <p>Your intelligent AI assistant</p>
      </div>

      <div class="auth-tabs">
        <button class="active" id="loginTab" type="button">Login</button>
        <button id="signupTab" type="button">Sign Up</button>
      </div>

      <form class="auth-form active" id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" required placeholder="Enter your email">
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required placeholder="Enter password">
        </div>

        <button class="primary-btn" type="submit">Login</button>
      </form>

      <form class="auth-form" id="signupForm">
        <div class="field">
          <label for="signupName">Full Name</label>
          <input id="signupName" type="text" required placeholder="Enter your name">
        </div>

        <div class="field">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" type="email" required placeholder="Enter your email">
        </div>

        <div class="field">
          <label for="signupPassword">Password</label>
          <input id="signupPassword" type="password" minlength="8" required placeholder="At least 8 characters">
        </div>

        <button class="primary-btn" type="submit">Create Account</button>
      </form>

      <p class="auth-message" id="authMessage"></p>
    </div>
  </section>

  <!-- MAIN CHAT -->
  <section class="chat-screen" id="chatScreen">

    <header class="chat-header">
      <h2>AXON AI</h2>
      <div class="header-actions">
        <button id="newChatBtn" type="button">New Chat</button>
        <button id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <main class="chat-messages" id="chatMessages">
      <div class="welcome" id="welcomeMessage">
        <h1>How can I help you?</h1>
        <p>Start a conversation with AXON AI</p>
      </div>
    </main>

    <div class="chat-input-area">
      <form class="chat-input-row" id="chatForm">
        <input id="chatInput" type="text" autocomplete="off" placeholder="Message AXON AI..." required>
        <button class="send-btn" type="submit">Send</button>
      </form>

      <div class="chat-tools">
        <button id="voiceBtn" type="button">Voice Input</button>
        <button id="clearBtn" type="button">Clear Chat</button>
      </div>
    </div>

  </section>

  <script>
    (() => {
      "use strict";

      const splash = document.getElementById("splashScreen");
      const loadingText = document.getElementById("loadingText");
      const authScreen = document.getElementById("authScreen");
      const chatScreen = document.getElementById("chatScreen");

      const messages = [
        "Initializing Experience",
        "Preparing Interface",
        "Almost Ready",
        "Experience Ready"
      ];

      let index = 0;

      const splashInterval = setInterval(() => {
        index++;
        loadingText.textContent = messages[index] || "Experience Ready";

        if (index >= messages.length - 1) {
          clearInterval(splashInterval);

          setTimeout(() => {
            splash.style.display = "none";
            authScreen.classList.add("active");
          }, 500);
        }
      }, 900);

      const loginTab = document.getElementById("loginTab");
      const signupTab = document.getElementById("signupTab");
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const authMessage = document.getElementById("authMessage");

      function showLogin() {
        loginTab.classList.add("active");
        signupTab.classList.remove("active");
        loginForm.classList.add("active");
        signupForm.classList.remove("active");
        authMessage.textContent = "";
      }

      function showSignup() {
        signupTab.classList.add("active");
        loginTab.classList.remove("active");
        signupForm.classList.add("active");
        loginForm.classList.remove("active");
        authMessage.textContent = "";
      }

      loginTab.addEventListener("click", showLogin);
      signupTab.addEventListener("click", showSignup);

      function getAccounts() {
        try {
          return JSON.parse(localStorage.getItem("axon_accounts") || "[]");
        } catch {
          return [];
        }
      }

      function saveAccounts(accounts) {
        localStorage.setItem("axon_accounts", JSON.stringify(accounts));
      }

      function openChat(name) {
        authScreen.classList.remove("active");
        chatScreen.classList.add("active");
        document.getElementById("welcomeMessage").querySelector("p").textContent =
          "Welcome, " + name + ". Start a conversation with AXON AI.";
      }

      
signupForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim().toLowerCase();
  const password = document.getElementById("signupPassword").value;

  authMessage.style.color = "#ff8e8e";

  if (!name || !email || password.length < 8) {
    authMessage.textContent =
      "Please enter valid details. Password must be at least 8 characters.";
    return;
  }

  const accounts = getAccounts();

  if (accounts.some(account => account.email === email)) {
    authMessage.textContent =
      "An account with this email already exists.";
    return;
  }

  try {
    accounts.push({
      name: name,
      email: email,
      password: password
    });

    saveAccounts(accounts);

    sessionStorage.setItem("axon_logged_in", "true");
    sessionStorage.setItem("axon_user_name", name);

    signupForm.reset();
    loginForm.reset();

    authMessage.textContent = "";

    openChat(name);

  } catch (error) {
    authMessage.style.color = "#ff8e8e";
    authMessage.textContent =
      "Account creation failed. Please try again.";
  }
});
      

        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim().toLowerCase();
        const password = document.getElementById("signupPassword").value;

        if (!name || !email || password.length < 8) {
          authMessage.textContent = "Please enter valid details. Password must be at least 8 characters.";
          return;
        }

        const accounts = getAccounts();

        if (accounts.some(account => account.email === email)) {
          authMessage.textContent = "An account with this email already exists.";
          return;
        }

        /*
          Demo-only local account storage.
          This is not secure authentication.
          Use a trusted backend with password hashing and sessions
          before deploying a real account system.
        */

        accounts.push({ name, email, password });
        saveAccounts(accounts);

        authMessage.style.color = "#7ee6a3";
        authMessage.textContent = "Account created. You can now log in.";

        signupForm.reset();
        showLogin();
      });

      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const email = document.getElementById("loginEmail").value.trim().toLowerCase();
        const password = document.getElementById("loginPassword").value;

        const accounts = getAccounts();
        const account = accounts.find(item =>
          item.email === email && item.password === password
        );

        if (!account) {
          authMessage.style.color = "#ff8e8e";
          authMessage.textContent = "Incorrect email or password.";
          return;
        }

        sessionStorage.setItem("axon_logged_in", "true");
        sessionStorage.setItem("axon_user_name", account.name);

        authMessage.textContent = "";
        openChat(account.name);
      });

      document.getElementById("logoutBtn").addEventListener("click", () => {
        sessionStorage.removeItem("axon_logged_in");
        sessionStorage.removeItem("axon_user_name");

        chatScreen.classList.remove("active");
        authScreen.classList.add("active");
        showLogin();
      });

      const chatForm = document.getElementById("chatForm");
      const chatInput = document.getElementById("chatInput");
      const chatMessages = document.getElementById("chatMessages");

      function addMessage(text, type) {
        const welcome = document.getElementById("welcomeMessage");
        if (welcome) welcome.style.display = "none";

        const message = document.createElement("div");
        message.className = "message " + type;
        message.textContent = text;

        chatMessages.appendChild(message);
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });

        return message;
      }

      async function getAIResponse(prompt) {
        /*
          Connect your own AI backend here.
          Do not place private API keys in frontend JavaScript.
        */
        return "AXON AI is ready. Connect an AI backend to enable intelligent replies.";
      }

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const prompt = chatInput.value.trim();
        if (!prompt) return;

        addMessage(prompt, "user");
        chatInput.value = "";

        const replyElement = addMessage("Thinking...", "ai");

        try {
          const response = await getAIResponse(prompt);
          replyElement.textContent = response;
        } catch {
          replyElement.textContent = "Something went wrong. Please try again.";
        }
      });

      document.getElementById("newChatBtn").addEventListener("click", () => {
        chatMessages.innerHTML = `
          <div class="welcome" id="welcomeMessage">
            <h1>How can I help you?</h1>
            <p>Start a conversation with AXON AI</p>
          </div>
        `;
      });

      document.getElementById("clearBtn").addEventListener("click", () => {
        chatMessages.innerHTML = `
          <div class="welcome" id="welcomeMessage">
            <h1>How can I help you?</h1>
            <p>Start a conversation with AXON AI</p>
          </div>
        `;
      });

      const voiceBtn = document.getElementById("voiceBtn");

      voiceBtn.addEventListener("click", () => {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          alert("Voice input is not supported in this browser.");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = "hi-IN";
        recognition.interimResults = false;

        voiceBtn.textContent = "Listening...";

        recognition.onresult = (event) => {
          chatInput.value = event.results[0][0].transcript;
          chatInput.focus();
        };

        recognition.onerror = () => {
          alert("Voice recognition could not complete. Please try again.");
        };

        recognition.onend = () => {
          voiceBtn.textContent = "Voice Input";
        };

        recognition.start();
      });

      const savedLogin = sessionStorage.getItem("axon_logged_in");
      const savedName = sessionStorage.getItem("axon_user_name");

      if (savedLogin === "true" && savedName) {
        clearInterval(splashInterval);
        splash.style.display = "none";
        openChat(savedName);
      }

    })();
  </script>

</body>
</html>

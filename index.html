<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f">
<title>AXON — Advanced AI Solutions</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0c1a2b;--panel2:#102238;--line:#203b55;--text:#f3f8ff;--muted:#91a9c1;--cyan:#46e0d3;--blue:#4c83ff;--shadow:0 18px 55px #0005}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 50% -25%,#12385a 0%,var(--bg) 58%);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}button,textarea,input{font:inherit}button{color:inherit;cursor:pointer}
/* splash + loading */
#splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#030812;transition:opacity .55s ease,visibility .55s ease}#splash.done{opacity:0;visibility:hidden}.splash-inner{width:min(88vw,440px);text-align:center}.splash-logo{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 0 55px #00c9d755}.loader{height:3px;width:170px;margin:25px auto 0;border-radius:9px;background:#183149;overflow:hidden}.loader:after{content:"";display:block;height:100%;width:38%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--cyan));animation:load 1.25s ease-in-out infinite}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(380%)}}.loading-label{margin:12px 0 0;color:#8eabc4;font-size:11px;letter-spacing:3px;text-transform:uppercase}
.app{height:100dvh;max-width:1120px;margin:auto;padding:0 22px;display:flex;flex-direction:column}.topbar{height:78px;flex:0 0 78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:13px;min-width:0;flex:1}.brand-mark{width:43px;height:43px;overflow:hidden;border-radius:12px;border:1px solid #3a9fa9;box-shadow:0 0 22px #00c9c933;flex:none}.brand-mark img{width:100%;height:100%;object-fit:cover;display:block}.brand-copy{line-height:1.1}.brand-copy strong{font-size:19px;letter-spacing:3px}.brand-copy span{display:block;color:#8da8bf;font-size:9px;letter-spacing:1.6px;margin-top:5px}.top-actions{display:flex;align-items:center;gap:9px;flex:none;white-space:nowrap}.icon-btn,.new-btn{height:42px;border:1px solid var(--line);background:#102239;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}.icon-btn{width:42px;font-size:18px}.new-btn{padding:0 15px;white-space:nowrap;flex:none;min-width:112px;background:linear-gradient(110deg,#3159c9,#078e9d);border:0;font-weight:650;box-shadow:0 7px 20px #087eaa33}.icon-btn:hover,.new-btn:hover,.quick:hover{transform:translateY(-2px);filter:brightness(1.13)}
.layout{flex:1;min-height:0;display:flex;flex-direction:column;max-width:900px;width:100%;margin:0 auto}.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 10px 18px}.welcome-mark{width:76px;height:76px;border-radius:23px;overflow:hidden;border:1px solid #3a9fa9;box-shadow:0 0 45px #00c9c933;margin-bottom:22px}.welcome-mark img{width:100%;height:100%;object-fit:cover;display:block}.eyebrow{color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase}.welcome h1{font-size:clamp(30px,6vw,48px);letter-spacing:-1.5px;line-height:1.1;margin:10px 0}.welcome h1 span{background:linear-gradient(100deg,#64a5ff,#48e2d3);background-clip:text;-webkit-background-clip:text;color:transparent}.welcome p{max-width:470px;color:var(--muted);margin:0}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(100%,670px);margin-top:34px}.quick{border:1px solid #27435d;background:linear-gradient(145deg,#10243a,#0b192a);border-radius:15px;padding:14px 13px;text-align:left;min-height:92px;transition:.2s}.quick-icon{width:31px;height:31px;border-radius:10px;background:#173b52;color:var(--cyan);display:grid;place-items:center;font-size:16px;margin-bottom:8px}.quick b{display:block;font-size:13px}.quick small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
#chat{display:none;flex:1;min-height:0;overflow:auto;padding:24px 4px 18px;scroll-behavior:smooth}#chat.show{display:block}.message{display:flex;gap:11px;margin:0 0 22px;align-items:flex-start}.message.user{justify-content:flex-end}.avatar{width:34px;height:34px;border-radius:11px;overflow:hidden;flex:none;border:1px solid #347e91;background:#102b40}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar.user-avatar{display:grid;place-items:center;background:#243a65;border-color:#496da8;font-size:14px}.bubble{max-width:min(78%,690px);padding:12px 15px;border:1px solid #203c55;border-radius:5px 16px 16px 16px;background:#102238;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(135deg,#23447a,#1b3762);border-color:#355b91;border-radius:16px 5px 16px 16px}.message-meta{font-size:10px;color:#7f9bb5;margin:0 0 5px 2px}.typing{display:inline-flex;gap:4px;padding:7px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:dot 1s infinite alternate}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes dot{to{opacity:.25;transform:translateY(-3px)}}
.composer-area{padding:14px 0 16px;background:linear-gradient(transparent,#07111f 15%)}.composer{position:relative;border:1px solid #2b5672;background:linear-gradient(145deg,#10243a,#0b1929);border-radius:20px;padding:10px 11px 9px;box-shadow:var(--shadow),0 0 24px #008da31b}.composer:focus-within{border-color:#48c8ca;box-shadow:var(--shadow),0 0 0 3px #45d9d31a}.composer textarea{display:block;width:100%;min-height:48px;max-height:150px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);padding:7px 7px 10px;font-size:15px}.composer textarea::placeholder{color:#7792ab}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.tools-left,.tools-right{display:flex;align-items:center;gap:7px}.tool-btn{width:36px;height:36px;border:1px solid #29445d;border-radius:11px;background:#122941;color:#a9c6dc;display:grid;place-items:center;font-size:17px;transition:.2s}.tool-btn:hover{color:var(--cyan);border-color:#3e9da8}.send-btn{width:39px;height:39px;border:0;border-radius:12px;background:linear-gradient(135deg,#456df0,#08a9ad);font-size:18px;box-shadow:0 5px 17px #087eaa44}.send-btn:disabled{opacity:.45;cursor:not-allowed}.hint{color:#69849c;font-size:10px;margin:8px 5px 0}.selected-file{font-size:11px;color:var(--cyan);padding:0 5px}.theme-select{background:#10243a;color:#9eb7ca;border:1px solid #29445d;border-radius:9px;padding:7px;font-size:11px;outline:none}
#attachment-menu{display:none;position:absolute;bottom:58px;left:8px;z-index:5;grid-template-columns:repeat(2,145px);gap:7px;padding:9px;background:#f6f9fc;color:#102033;border-radius:14px;box-shadow:0 12px 35px #0009}#attachment-menu.open{display:grid}.attach-option{border:1px solid #dce5ee;border-radius:9px;background:white;color:#20344b;text-align:left;padding:10px;font-size:12px}.attach-option:hover{background:#eaf7f8}.side-panel{position:fixed;z-index:12;inset:0 auto 0 0;width:min(300px,86vw);padding:20px;background:#0b1a2b;border-right:1px solid #29445d;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow)}.side-panel.open{transform:none}.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.side-head strong{letter-spacing:2px}.side-link{width:100%;display:flex;align-items:center;gap:12px;margin:6px 0;padding:12px 13px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;color:#c4d5e5}.side-link:hover{background:#132b42;border-color:#25455f}.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:11}.overlay.open{display:block}.toast{position:fixed;z-index:20;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#17344a;border:1px solid #36718a;border-radius:12px;padding:10px 15px;color:#e9fbff;font-size:13px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
body.light{--bg:#edf4fa;--panel:#fff;--panel2:#f2f7fb;--line:#d4e0ea;--text:#14283b;--muted:#60788d;background:radial-gradient(ellipse at 50% -25%,#d3edfa,#edf4fa 60%);color:var(--text)}body.light .topbar{border-color:#d5e1eb}body.light .composer,body.light .quick{background:#fff}body.light #chat .bubble{background:#fff;color:#14283b;border-color:#d5e1eb}body.light #chat .user .bubble{background:#e2edff}body.light .tool-btn{background:#f0f5fa;color:#456178}body.light .composer textarea{color:#14283b}body.light .side-panel{background:#f7fbff}body.light .side-link{color:#233e54}
@media(max-width:600px){.app{padding:0 13px}.topbar{height:68px;flex-basis:68px}.brand-mark{width:39px;height:39px;flex:none}.brand-copy strong{font-size:17px}.brand-copy span{font-size:8px}.new-btn{height:39px;padding:0 11px;font-size:12px;min-width:104px;white-space:nowrap}.top-actions{gap:6px}.icon-btn{width:39px;height:39px}.welcome{padding-top:20px}.quick-grid{grid-template-columns:1fr;gap:8px;margin-top:25px}.quick{min-height:68px;padding:10px 12px;display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:center}.quick-icon{grid-row:span 2;margin:0}.quick b{align-self:end}.quick small{align-self:start}.bubble{max-width:86%;font-size:14px}.composer-area{padding-bottom:10px}.hint{font-size:9px}#attachment-menu{grid-template-columns:repeat(2,minmax(125px,1fr));max-width:calc(100vw - 48px)}}
</style></head>

<script>
const $=id=>document.getElementById(id);let chosenFile=null,toastTimer;
const splashStartedAt=Date.now();function hideSplashAfterFiveSeconds(){const remaining=Math.max(0,5000-(Date.now()-splashStartedAt));setTimeout(()=>$('splash').classList.add('done'),remaining)}if(document.readyState==='complete'||document.readyState==='interactive')hideSplashAfterFiveSeconds();else document.addEventListener('DOMContentLoaded',hideSplashAfterFiveSeconds,{once:true});
function toggleSide(open){$('side').classList.toggle('open',open);$('overlay').classList.toggle('open',open)}
function showToast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function showNotice(name){toggleSide(false);showToast(name+' will be available after setup.')}
function toggleAttachments(){$('attachment-menu').classList.toggle('open')}
function pickFile(accept){$('file-input').accept=accept;$('file-input').click();$('attachment-menu').classList.remove('open')}
function fileSelected(input){chosenFile=input.files[0]||null;$('selected-file').textContent=chosenFile?'Attached: '+chosenFile.name:''}
function toggleTheme(){setTheme(document.body.classList.contains('light')?'dark':'light')}
function setTheme(theme){document.body.classList.toggle('light',theme==='light');$('theme-select').value=theme}
function quickPrompt(text){$('prompt').value=text;$('prompt').focus()}
function newChat(){ $('chat').innerHTML='';$('chat').classList.remove('show');$('welcome').style.display='flex';$('prompt').value='';chosenFile=null;$('selected-file').textContent='';toggleSide(false);$('prompt').focus() }
function addMessage(text,who){const row=document.createElement('div');row.className='message '+who;const avatar=document.createElement('div');avatar.className='avatar '+(who==='user'?'user-avatar':'');if(who==='assistant'){const img=document.createElement('img');img.src='axon-mark.jpg';img.alt='AXON';avatar.appendChild(img)}else avatar.textContent='You';const content=document.createElement('div');const meta=document.createElement('div');meta.className='message-meta';meta.textContent=who==='assistant'?'AXON AI':'YOU';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;content.append(meta,bubble);if(who==='user')row.append(content,avatar);else row.append(avatar,content);$('chat').appendChild(row);$('chat').classList.add('show');$('welcome').style.display='none';$('chat').scrollTop=$('chat').scrollHeight;return row}
async function sendMessage(){const text=$('prompt').value.trim();if(!text&&!chosenFile)return;const outgoing=text||(chosenFile?'Please review this attachment: '+chosenFile.name:'');addMessage(outgoing,'user');$('prompt').value='';$('send-btn').disabled=true;const typing=addMessage('','assistant');typing.querySelector('.bubble').innerHTML='<span class="typing"><i></i><i></i><i></i></span>';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:outgoing,attachmentName:chosenFile?.name||null})});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI service is not configured yet.');typing.querySelector('.bubble').textContent=data.reply||'No response received.'}catch(error){typing.querySelector('.bubble').textContent=error.message.includes('Failed to fetch')?'AXON server is not connected. Start the backend to enable AI chat.':error.message}finally{$('send-btn').disabled=false;$('chat').scrollTop=$('chat').scrollHeight;chosenFile=null;$('file-input').value='';$('selected-file').textContent=''}}
function voiceInput(){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){showToast('Voice input is not supported in this browser.');return}const recognition=new Recognition();recognition.lang='en-IN';recognition.onresult=e=>{$('prompt').value+=e.results[0][0].transcript};recognition.onerror=()=>showToast('Voice input could not start.');recognition.start()}
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('prompt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,150)+'px'});document.addEventListener('click',e=>{if(!$('attachment-menu').contains(e.target)&&!e.target.closest('.tool-btn'))$('attachment-menu').classList.remove('open')});
</script></body></html>

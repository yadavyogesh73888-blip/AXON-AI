
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>AXON AI</title>

<style>
:root{
--bg:#07111f;--panel:#10243a;--panel2:#0c1b2c;
--line:#29445f;--text:#f2f7ff;--muted:#91a9c1;
--cyan:#35d5f5;--danger:#ff7895;
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font-family:Arial,sans-serif;min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
#splash{
position:fixed;inset:0;background:var(--bg);
display:flex;align-items:center;justify-content:center;
z-index:10;font-size:38px;font-weight:bold;color:var(--cyan);
}
#authScreen{
min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:25px;
}
.auth-card{
width:100%;max-width:580px;background:linear-gradient(145deg,#142c43,#0b1b2c);
border:1px solid var(--line);border-radius:42px;
padding:40px;text-align:center;
}
.logo{font-size:54px;font-weight:bold;color:var(--cyan);margin:0}
.subtitle{color:var(--muted);font-size:19px;line-height:1.5}
.auth-card h2{font-size:34px;margin:45px 0 32px}
.field{
width:100%;padding:24px 27px;margin:10px 0;
border:1px solid var(--line);border-radius:20px;
background:#071a29;color:white;font-size:19px;outline:none;
}
.primary,.google{
width:100%;padding:24px;border-radius:19px;
font-size:20px;font-weight:bold;margin-top:15px;
}
.primary{background:var(--cyan);color:#041522}
.google{background:#1a3851;color:white;border:1px solid var(--line)}
.auth-links{margin-top:30px;color:var(--cyan);line-height:2}
.auth-links a{color:var(--cyan);cursor:pointer;margin:5px}
#error{color:var(--danger);margin-top:15px;overflow-wrap:anywhere}
#app{min-height:100vh;display:flex}
.sidebar{
width:270px;background:var(--panel2);
border-right:1px solid var(--line);padding:20px;
display:flex;flex-direction:column;gap:12px;
}
.brand{font-size:28px;font-weight:bold;color:var(--cyan);padding:12px}
.menu{
padding:15px;background:var(--panel);color:white;
border:1px solid var(--line);border-radius:13px;text-align:left;
}
.menu:hover{border-color:var(--cyan)}
.history{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
padding:18px 22px;border-bottom:1px solid var(--line);
display:flex;justify-content:space-between;align-items:center;
}
.topbar strong{color:var(--cyan);font-size:23px}
.chat{
flex:1;padding:22px;overflow-y:auto;max-width:950px;
width:100%;margin:auto;
}
.message{
padding:15px 18px;border-radius:18px;margin:13px 0;
max-width:85%;line-height:1.6;white-space:pre-wrap;
overflow-wrap:anywhere;
}
.user{background:#16425a;margin-left:auto}
.bot{background:var(--panel);border:1px solid var(--line)}
.composer{
max-width:950px;width:100%;margin:auto;padding:15px;
display:flex;gap:8px;align-items:center;
}
.composer textarea{
flex:1;resize:none;min-height:55px;max-height:130px;
padding:17px;border-radius:18px;background:var(--panel);
border:1px solid var(--line);color:white;outline:none;
}
.action{
background:var(--panel);color:var(--cyan);
border:1px solid var(--line);border-radius:15px;
padding:15px;font-size:18px;
}
.status{padding:0 20px 12px;color:var(--muted);font-size:13px}
#cameraBox{padding:15px;text-align:center}
video{max-width:100%;border-radius:15px}
@media(max-width:700px){
.sidebar{width:75px;padding:8px}
.sidebar .brand{font-size:15px;padding:8px}
.menu{font-size:11px;padding:12px 5px;text-align:center}
.history{display:none}
.auth-card{padding:25px 18px;border-radius:28px}
.logo{font-size:43px}
.auth-card h2{font-size:28px}
.field{padding:19px}
.composer{padding:9px;gap:5px}
.action{padding:12px 10px}
}
</style>
</head>

<body>

<div id="splash">AXON AI</div>

<section id="authScreen" class="hidden">
<div class="auth-card">
<h1 class="logo">AXON AI</h1>
<p class="subtitle">Your intelligent AI assistant for chat, media, and creation</p>

<h2 id="authTitle">Create Account</h2>

<input id="name" class="field" placeholder="Your name">
<input id="email" class="field" type="email" placeholder="Email address">
<input id="password" class="field" type="password" placeholder="Password">

<button class="primary" id="authButton">Sign Up</button>
<button class="google" id="googleButton">Continue with Google</button>

<div class="auth-links">
<a id="switchAuth">Already registered? Login</a>
<a id="forgot">Forgot password?</a>
</div>
<div id="error"></div>
</div>
</section>

<section id="app" class="hidden">
<aside class="sidebar">
<div class="brand">AXON AI</div>
<button class="menu" id="newChat">＋ New Chat</button>
<button class="menu" id="historyButton">History</button>
<div id="historyList" class="history"></div>
<button class="menu" id="profileButton">Profile</button>
<button class="menu" id="imageButton">Image</button>
<button class="menu" id="videoButton">Video</button>
<button class="menu" id="voiceButton">Voice Control: OFF</button>
<button class="menu" id="themeButton">Dark Theme: ON</button>
<button class="menu" id="logoutButton">Logout</button>
</aside>

<main class="main">
<header class="topbar">
<strong>AXON AI</strong>
<span id="welcomeUser">Welcome</span>
</header>

<div id="chat" class="chat">
<div class="message bot">Hello! Main AXON AI hoon. Aaj main aapki kya help kar sakta hoon?</div>
</div>

<div id="cameraBox" class="hidden">
<video id="camera" autoplay playsinline></video>
<button class="action" id="stopCamera">Stop Camera</button>
</div>

<div class="composer">
<button class="action" id="plusButton">＋</button>
<button class="action" id="micButton">🎙</button>
<textarea id="prompt" placeholder="Message AXON AI..."></textarea>
<button class="action" id="sendButton">➤</button>
</div>
<div class="status" id="status">AXON AI ready</div>
</main>
</section>

<input type="file" id="fileInput" hidden>
<input type="file" id="videoInput" accept="video/*" hidden>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,onAuthStateChanged,createUserWithEmailAndPassword,
signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,
sendPasswordResetEmail,updateProfile,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* Firebase configuration */
const firebaseConfig={
apiKey:"YOUR_FIREBASE_API_KEY",
authDomain:"axon-ai-9ee3b.firebaseapp.com",
projectId:"axon-ai-9ee3b",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
appId:"YOUR_FIREBASE_APP_ID"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const provider=new GoogleAuthProvider();

const $=id=>document.getElementById(id);
let signup=true,voiceEnabled=false,chatHistory=[];
let currentId=Date.now(),cameraStream=null,recorder=null;
let recordingChunks=[];

function status(message){$("status").textContent=message}
function showError(message){$("error").textContent=message}

function showScreen(user){
$("splash").classList.add("hidden");
$("authScreen").classList.toggle("hidden",!!user);
$("app").classList.toggle("hidden",!user);
if(user){
$("welcomeUser").textContent="Welcome, "+(user.displayName||user.email);
loadHistory();
}
}

onAuthStateChanged(auth,user=>showScreen(user));

function authError(error){
const messages={
"auth/email-already-in-use":"Email already registered. Login karein.",
"auth/invalid-email":"Email address sahi nahi hai.",
"auth/weak-password":"Password kam se kam 6 characters ka rakhein.",
"auth/invalid-credential":"Email ya password galat hai.",
"auth/user-not-found":"Account nahi mila.",
"auth/wrong-password":"Password galat hai.",
"auth/popup-closed-by-user":"Google login band ho gaya.",
"auth/api-key-not-valid":"Firebase API Key galat hai. Firebase config check karein."
};
showError(messages[error.code]||error.message);
}

$("authButton").onclick=async()=>{
showError("");
const email=$("email").value.trim();
const password=$("password").value;
const name=$("name").value.trim();
if(!email||!password){showError("Email aur password bharein.");return}
try{
if(signup){
const result=await createUserWithEmailAndPassword(auth,email,password);
if(name)await updateProfile(result.user,{displayName:name});
}else{
await signInWithEmailAndPassword(auth,email,password);
}
}catch(error){authError(error)}
};

$("switchAuth").onclick=()=>{
signup=!signup;
$("authTitle").textContent=signup?"Create Account":"Welcome Back";
$("authButton").textContent=signup?"Sign Up":"Login";
$("name").classList.toggle("hidden",!signup);
$("switchAuth").textContent=signup?"Already registered? Login":"Create new account";
showError("");
};

$("googleButton").onclick=async()=>{
showError("");
try{await signInWithPopup(auth,provider)}
catch(error){authError(error)}
};

$("forgot").onclick=async()=>{
const email=$("email").value.trim();
if(!email){showError("Pehle email address likhein.");return}
try{
await sendPasswordResetEmail(auth,email);
showError("Password reset email bhej diya gaya hai.");
}catch(error){authError(error)}
};

$("logoutButton").onclick=()=>signOut(auth);

function addMessage(message,type){
const div=document.createElement("div");
div.className="message "+type;
div.textContent=message;
$("chat").appendChild(div);
$("chat").scrollTop=$("chat").scrollHeight;
}

function saveHistory(){
if(!auth.currentUser)return;
const key="axon_history_"+auth.currentUser.uid;
let list=JSON.parse(localStorage.getItem(key)||"[]");
list=list.filter(item=>item.id!==currentId);
list.unshift({id:currentId,messages:chatHistory});
localStorage.setItem(key,JSON.stringify(list.slice(0,30)));
loadHistory();
}

function loadHistory(){
if(!auth.currentUser)return;
const key="axon_history_"+auth.currentUser.uid;
const list=JSON.parse(localStorage.getItem(key)||"[]");
$("historyList").innerHTML="";
list.forEach(item=>{
const button=document.createElement("button");
button.className="menu";
button.textContent="Conversation "+item.id;
button.onclick=()=>{
currentId=item.id;
chatHistory=item.messages||[];
$("chat").innerHTML="";
chatHistory.forEach(m=>addMessage(m.content,m.role==="user"?"user":"bot"));
};
$("historyList").appendChild(button);
});
}

$("newChat").onclick=()=>{
saveHistory();
currentId=Date.now();
chatHistory=[];
$("chat").innerHTML="";
addMessage("New conversation started. Main aapki kya help kar sakta hoon?","bot");
};

$("historyButton").onclick=loadHistory;

async function sendMessage(){
const input=$("prompt");
const message=input.value.trim();
if(!message)return;
input.value="";
addMessage(message,"user");
status("AXON AI is thinking...");
try{
const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message,history:chatHistory})
});
if(!response.ok)throw new Error("Server error: "+response.status);
const data=await response.json();
const reply=data.reply||data.response||data.answer||"No response received.";
addMessage(reply,"bot");
chatHistory.push({role:"user",content:message});
chatHistory.push({role:"assistant",content:reply});
saveHistory();
status("AXON AI ready");
}catch(error){
addMessage("Connection error. Backend /api/chat check karein.","bot");
status(error.message);
}
}

$("sendButton").onclick=sendMessage;
$("prompt").addEventListener("keydown",event=>{
if(event.key==="Enter"&&!event.shiftKey){
event.preventDefault();sendMessage();
}
});

$("voiceButton").onclick=()=>{
voiceEnabled=!voiceEnabled;
$("voiceButton").textContent="Voice Control: "+(voiceEnabled?"ON":"OFF");
status(voiceEnabled?"Voice control enabled":"Voice control disabled");
};

$("micButton").onclick=()=>{
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){status("Voice recognition is not supported.");return}
const recognition=new SR();
recognition.lang="hi-IN";
recognition.onstart=()=>status("Listening...");
recognition.onresult=event=>{
$("prompt").value=event.results[0][0].transcript;
if(voiceEnabled)sendMessage();
};
recognition.onerror=()=>status("Microphone permission check karein.");
recognition.onend=()=>status("Voice ready");
recognition.start();
};

$("plusButton").onclick=()=>{
const choice=prompt("Type: photo, camera, video, record");
if(choice==="photo")$("fileInput").click();
if(choice==="video")$("videoInput").click();
if(choice==="camera")startCamera();
if(choice==="record")startRecording();
};

$("fileInput").onchange=event=>{
const file=event.target.files[0];
if(file)addMessage("Selected file: "+file.name,"user");
};

$("videoInput").onchange=event=>{
const file=event.target.files[0];
if(file)addMessage("Selected video: "+file.name,"user");
};

async function startCamera(){
try{
cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
$("camera").srcObject=cameraStream;
$("cameraBox").classList.remove("hidden");
}catch(error){status("Camera permission required.")}
}

$("stopCamera").onclick=()=>{
if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop());
cameraStream=null;
$("cameraBox").classList.add("hidden");
};

async function startRecording(){
try{
const stream=await navigator.mediaDevices.getDisplayMedia({video:true});
recorder=new MediaRecorder(stream);
recordingChunks=[];
recorder.ondataavailable=e=>recordingChunks.push(e.data);
recorder.onstop=()=>{
const blob=new Blob(recordingChunks,{type:"video/webm"});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");
link.href=url;link.download="axon-recording.webm";link.click();
stream.getTracks().forEach(track=>track.stop());
};
recorder.start();
status("Recording started. Stop sharing to save.");
}catch(error){status("Screen recording permission required.")}
}

$("imageButton").onclick=()=>{
alert("Image generation ke liye image API endpoint connect karna hoga.");
};

$("videoButton").onclick=()=>{
alert("Video generation ke liye video API endpoint connect karna hoga.");
};

$("profileButton").onclick=()=>{
const user=auth.currentUser;
alert("Name: "+(user.displayName||"Not set")+"\nEmail: "+user.email);
};

$("themeButton").onclick=()=>{
const light=document.body.dataset.theme!=="light";
document.body.dataset.theme=light?"light":"dark";
if(light){
document.body.style.setProperty("--bg","#edf4fa");
document.body.style.setProperty("--panel","#dce9f3");
document.body.style.setProperty("--panel2","#d2e2ef");
document.body.style.setProperty("--text","#10243a");
$("themeButton").textContent="Dark Theme: OFF";
}else{
document.body.style.setProperty("--bg","#07111f");
document.body.style.setProperty("--panel","#10243a");
document.body.style.setProperty("--panel2","#0c1b2c");
document.body.style.setProperty("--text","#f2f7ff");
$("themeButton").textContent="Dark Theme: ON";
}
};

window.addEventListener("load",()=>{
setTimeout(()=>$("splash").classList.add("hidden"),700);
});
</script>
</body>
</html>

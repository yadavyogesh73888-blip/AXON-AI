<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXON AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #070b16;
      color: #f1f5f9;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #0d1426;
      border-bottom: 1px solid #1e293b;
      gap: 8px;
    }
    .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .auth-box { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .user-pill { font-size: 12px; color: #cbd5e1; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #1e293b; color: #e2e8f0; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 84%;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
    }
    .bot {
      align-self: flex-start;
      background: #111827;
      border: 1px solid #1f2937;
      color: #f8fafc;
    }
    .msg img {
      max-width: 190px;
      border-radius: 10px;
      display: block;
      margin-bottom: 6px;
    }
    .composer {
      padding: 10px 12px;
      background: #0d1426;
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: #111827;
      border: 1px solid #263248;
      color: #fff;
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    .status-note {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      padding: 4px 10px 8px;
      background: #0d1426;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ AXON AI Chat</div>
    <div class="auth-box">
      <span id="userLabel" class="user-pill">Guest</span>
      <button id="googleSignInBtn" type="button">Google Sign-In</button>
      <button id="signOutBtn" type="button" class="secondary" style="display:none;">Logout</button>
    </div>
  </header>

  <main id="chat">
    <div class="msg bot">Hi bhai! Chat aur photo analysis dono ab ready hain. Kya help chahiye?</div>
  </main>

  <form id="chatForm" class="composer">
    <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden />
    <button id="photoBtn" type="button" class="secondary" title="Upload Photo">+ Photo</button>
    <input id="msgInput" type="text" placeholder="Message AXON AI..." autocomplete="off" />
    <button id="sendBtn" type="submit">Send</button>
  </form>
  <div id="helperBar" class="status-note">AXON AI can make mistakes. Verify important details.</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    // Apni asli Firebase config yahan daalein:
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("chatForm");
    const inputEl = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const photoBtn = document.getElementById("photoBtn");
    const photoInput = document.getElementById("photoInput");
    const googleSignInBtn = document.getElementById("googleSignInBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const userLabel = document.getElementById("userLabel");
    const helperBar = document.getElementById("helperBar");

    let auth = null;
    let provider = null;
    let pendingImageData = null;

    const hasRealFirebaseConfig =
      firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");

    if (hasRealFirebaseConfig) {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });

      getRedirectResult(auth).catch((err) => {
        console.error("Redirect auth error:", err);
      });

      onAuthStateChanged(auth, (user) => {
        if (user) {
          userLabel.textContent = user.displayName || user.email || "Signed In";
          googleSignInBtn.style.display = "none";
          signOutBtn.style.display = "inline-block";
        } else {
          userLabel.textContent = "Guest";
          googleSignInBtn.style.display = "inline-block";
          signOutBtn.style.display = "none";
        }
      });
    } else {
      helperBar.textContent = "Note: Google Sign-In ke liye index.html mein apni Firebase config daalein.";
    }

    googleSignInBtn.addEventListener("click", async () => {
      if (!hasRealFirebaseConfig || !auth || !provider) {
        alert("Google Sign-In ke liye pehle index.html mein Firebase config aur Firebase Console mein Authorized Domain set karein.");
        return;
      }

      googleSignInBtn.disabled = true;
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error("Google sign-in error:", err);
        if (
          err.code === "auth/popup-blocked" ||
          err.code === "auth/operation-not-supported-in-this-environment"
        ) {
          try {
            await signInWithRedirect(auth, provider);
            return;
          } catch (redirectErr) {
            alert("Google Sign-In error: " + (redirectErr.message || redirectErr.code));
          }
        } else if (err.code === "auth/unauthorized-domain") {
          alert(
            "Domain authorize nahi hai! Firebase Console -> Authentication -> Settings -> Authorized domains mein apna website domain add karein."
          );
        } else if (err.code !== "auth/popup-closed-by-user") {
          alert("Google Sign-In failed: " + (err.message || err.code));
        }
      } finally {
        googleSignInBtn.disabled = false;
      }
    });

    signOutBtn.addEventListener("click", async () => {
      if (auth) {
        await signOut(auth);
      }
    });

    function appendMessage(role, text, imgSrc = null) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      if (imgSrc) {
        const img = document.createElement("img");
        img.src = imgSrc;
        div.appendChild(img);
      }
      if (text) {
        const span = document.createElement("span");
        span.textContent = text;
        div.appendChild(span);
      }
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function compressImageToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxSide = 1024;
            let { width, height } = img;
            if (width > maxSide || height > maxSide) {
              if (width > height) {
                height = Math.round((height * maxSide) / width);
                width = maxSide;
              } else {
                width = Math.round((width * maxSide) / height);
                height = maxSide;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.8));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    photoBtn.addEventListener("click", () => photoInput.click());

    photoInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        pendingImageData = await compressImageToDataUrl(file);
        helperBar.textContent = `Photo ready: ${file.name} — ab Send dabayein ya saath mein message likhein.`;
      } catch {
        alert("Photo load nahi ho paayi.");
      }
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      const imgToSend = pendingImageData;

      if (!text && !imgToSend) return;

      inputEl.value = "";
      pendingImageData = null;
      photoInput.value = "";
      helperBar.textContent = "AXON AI can make mistakes. Verify important details.";
      sendBtn.disabled = true;

      appendMessage("user", text || "Is photo ka analysis karo", imgToSend);
      const loadingMsg = appendMessage("bot", "Soch raha hoon...");

      try {
        if (imgToSend) {
          const res = await fetch("/api/vision", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              imageData: imgToSend,
              prompt: text || "Analyze this image clearly and helpfully."
            })
          });
          const data = await res.json();
          loadingMsg.textContent = data.reply || data.error || "Photo analysis failed.";
        } else {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });
          const data = await res.json();
          loadingMsg.textContent = data.reply || "Kuch response nahi aaya.";
        }
      } catch {
        loadingMsg.textContent = "Network ya server error aaya. Dobara try karein.";
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });
  </script>
</body>
</html>

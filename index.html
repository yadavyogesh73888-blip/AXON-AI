  authElement("authTitle").textContent =  
    isSignup ? "Create Your Account" : "Welcome Back";  
  
  authElement("authSubtitle").textContent =  
    isSignup  
      ? "Join AXON AI and start your intelligence journey."  
      : "Sign in to continue your AXON AI experience.";  
  
  authElement("authSubmit").textContent =  
    isSignup ? "Create AXON Account" : "Sign In to AXON AI";  
  
  authElement("authPassword").autocomplete =  
    isSignup ? "new-password" : "current-password";  
  
  authElement("authConfirmPassword").required =  
    isSignup;  
  
  authElement("authName").required =  
    isSignup;  
  
  hideAuthMessage();  
  
  authElement("authForm").reset();  
  
  authElement("authPassword").type = "password";  
  
  authElement("passwordToggle").textContent = "Show";  
}  
  
function toggleAuthPassword() {  
  
  const password = authElement("authPassword");  
  
  const button = authElement("passwordToggle");  
  
  const visible = password.type === "password";  
  
  password.type = visible ? "text" : "password";  
  
  button.textContent = visible ? "Hide" : "Show";  
}  
  
function showAuthMessage(message, type) {  
  
  const element = authElement("authMessage");  
  
  element.textContent = message;  
  
  element.className =  
    "auth-message show " + type;  
}  
  
function hideAuthMessage() {  
  
  const element = authElement("authMessage");  
  
  element.textContent = "";  
  
  element.className = "auth-message";  
}

  showAuthMessage(message, "success");

function showForgotPassword() {

    "success"

    "success"  
  );

authElement("authForm").addEventListener(  
  "submit",  
  async function(event) {  
  
    event.preventDefault();  
  
    const email =  
      authElement("authEmail").value.trim();  
  
    const password =  
      authElement("authPassword").value;  
  
    const isSignup =  
      currentAuthMode === "signup";  
  
    if (!email || !password) {  
  
      showAuthMessage(  
        "Please enter your email and password.",  
        "error"  
      );  
  
      return;  
    }  
  
    if (password.length < 8) {  
  
      showAuthMessage(  
        "Password must contain at least 8 characters.",  
        "error"  
      );  
  
      return;  
    }  
  
    if (isSignup) {  
  
      const name =  
        authElement("authName").value.trim();  
  
      const confirmPassword =  
        authElement("authConfirmPassword").value;  
  
      if (!name) {  
  
        showAuthMessage(  
          "Please enter your full name.",  
          "error"  
        );  
  
        return;  
      }  
  
      if (password !== confirmPassword) {  
  
        showAuthMessage(  
          "Passwords do not match.",  
          "error"  
        );  
  
        return;  
      }  
  
      showAuthMessage(  
        "Signup UI is ready. Connect a secure authentication API to create real accounts.",  
        "success"  
      );  
  
      return;  
    }  
  
    showAuthMessage(  
      "Login UI is ready. Connect a secure authentication API to verify your account.",  
      "success"  
    );  
  
  }  
);  
  
/* SPLASH TO AUTH SCREEN */  
  
function openAXONLogin() {  
  
  const splash = document.querySelector(".splash");  
  
  if (splash) {  
    splash.style.display = "none";  
  }  
  
  authElement("authScreen").classList.add("active");  
  
}  
  
/* AUTO OPEN LOGIN AFTER SPLASH */  
  
window.addEventListener("load", () => {  
  
  setTimeout(() => {  
  
    openAXONLogin();  
  
  }, 3600);

/* ======================================  
   AXON AI ERROR MANAGEMENT  
====================================== */  
  
(() => {  
  
  const getElement = id =>  
    document.getElementById(id);  
  
  const errorScreen =  
    getElement("axonErrorScreen");  
  
  const errorTitle =  
    getElement("axonErrorTitle");  
  
  const errorDescription =  
    getElement("axonErrorDescription");  
  
  const errorIcon =  
    getElement("axonErrorIcon");  
  
  const errorCode =  
    getElement("axonErrorCode");  
  
  const retryButton =  
    getElement("axonRetryButton");  
  
  const backButton =  
    getElement("axonBackButton");  
  
  const connectionDot =  
    getElement("axonConnectionDot");  
  
  const connectionText =  
    getElement("axonConnectionText");  
  
  let lastRetryAction = null;  
  
  /* CONNECTION STATUS */  
  
  function updateConnectionStatus() {  
  
    const online = navigator.onLine;  
  
    connectionDot.className =  
      "connection-dot " +  
      (online ? "online" : "offline");  
  
    connectionText.textContent =  
      online ? "Internet Connected" : "No Internet Connection";  
  
  }  
  
  window.addEventListener(  
    "online",  
    updateConnectionStatus  
  );  
  
  window.addEventListener(  
    "offline",  
    () => {  
  
      updateConnectionStatus();  
  
      showError(  
        "No Internet Connection",  
        "Your device appears to be offline. Check your internet connection and try again.",  
        "NETWORK_ERROR"  
      );  
  
    }  
  );  
  
  updateConnectionStatus();  
  
  /* SHOW ERROR */  
  
  function showError(  
    title,  
    description,  
    code = "AXON_ERROR",  
    retryAction = null  
  ) {  
  
    errorTitle.textContent = title;  
  
    errorDescription.textContent = description;  
  
    errorCode.textContent = code;  
  
    errorIcon.textContent = "!";  
  
    lastRetryAction = retryAction;  
  
    errorScreen.classList.add("active");  
  
  }  
  
  /* HIDE ERROR */  
  
  function hideError() {  
  
    errorScreen.classList.remove("active");  
  
  }  
  
  /* RETRY */  
  
  retryButton.addEventListener(  
    "click",  
    async () => {  
  
      if (!navigator.onLine) {  
  
        showError(  
          "Still Offline",  
          "Please reconnect your device to the internet.",  
          "NETWORK_ERROR"  
        );  
  
        return;  
      }  
  
      if (typeof lastRetryAction === "function") {  
  
        retryButton.disabled = true;  
  
        retryButton.textContent = "Checking...";  
  
        try {  
  
          await lastRetryAction();  
  
          hideError();  
  
        } catch (error) {  
  
          showError(  
            "Connection Failed",  
            "The server is still unavailable. Please try again.",  
            "SERVER_ERROR",  
            lastRetryAction  
          );  
  
        } finally {  
  
          retryButton.disabled = false;  
  
          retryButton.textContent = "Try Again";  
  
        }  
  
      } else {  
  
        updateConnectionStatus();  
  
        hideError();  
  
      }  
  
    }  
  );  
  
  /* BACK TO LOGIN */  
  
  backButton.addEventListener(  
    "click",  
    () => {  
  
      hideError();  
  
      if (typeof openAXONLogin === "function") {  
  
        openAXONLogin();  
  
      }  
  
    }  
  );  
  
  /* SERVER HEALTH CHECK */  
  
  async function checkAXONServer() {  
  
    if (!navigator.onLine) {  
  
      updateConnectionStatus();  
  
      return false;  
  
    }  
  
    try {  
  
      const response = await fetch(  
        "/api/health",  
        {  
          method: "GET",  
          cache: "no-store",  
          signal: AbortSignal.timeout(8000)  
        }  
      );  
  
      if (!response.ok) {  
  
        throw new Error("Server health check failed");  
  
      }  
  
      connectionDot.className =  
        "connection-dot online";  
  
      connectionText.textContent =  
        "Server Connected";  
  
      return true;  
  
    } catch (error) {  
  
      connectionDot.className =  
        "connection-dot offline";  
  
      connectionText.textContent =  
        "Server Unavailable";  
  
      return false;  
  
    }  
  
  }  
  
  /* PUBLIC ERROR HANDLER */  
  
  window.AXONError = {  
  
    show: showError,  
  
    hide: hideError,  
  
    checkServer: checkAXONServer,  
  
    network: function() {  
  
      showError(  
        "Network Error",  
        "Unable to reach the AXON AI service. Please check your internet connection.",  
        "NETWORK_ERROR",  
        checkAXONServer  
      );  
  
    },  
  
    server: function() {  
  
      showError(  
        "Server Unavailable",  
        "The AXON AI server is not responding. Please try again shortly.",  
        "SERVER_ERROR",  
        checkAXONServer  
      );  
  
    },  
  
    api: function() {  
  
      showError(  
        "AI Service Error",  
        "The AI service could not complete your request. Please try again.",  
        "AI_API_ERROR"  
      );  
  
    }  
  
  };  
  
  /* INITIAL SERVER CHECK */  
  
  setTimeout(() => {  
  
    checkAXONServer();  
  
  }, 1500);

(() => {

  const messagesArea = $("axChatMessages");

  const sendButton = $("axSendButton");

  const fileLabel = $("axFileLabel");  
  
  const STORAGE_KEY = "axon_ai_chat_history_v1";  
  
  let chats = [];

  let selectedFile = null;  
  let recognition = null;  
  
  /* SAFE ID GENERATOR */  
  
  function createId() {  
    return "chat_" +  
      Date.now() + "_" +  
      Math.random().toString(36).slice(2, 8);  
  }  
  
  /* LOAD SAVED CHATS */  
  
  function loadChats() {  
  
    try {  
  
      const saved = localStorage.getItem(STORAGE_KEY);  
  
      chats = saved ? JSON.parse(saved) : [];  
  
      if (!Array.isArray(chats)) {  
        chats = [];  
      }  
  
    } catch (error) {  
  
      chats = [];  
  
    }  
  
  }  
  
  /* SAVE CHATS */  
  
  function saveChats() {  
  
    try {  
  
      localStorage.setItem(  
        STORAGE_KEY,  
        JSON.stringify(chats)  
      );  
  
    } catch (error) {  
  
      console.warn("AXON chat history could not be saved.", error);  
  
    }  
  
  }  
  
  /* CURRENT CHAT */  
  
  function getCurrentChat() {  
  
    return chats.find(

    );  
  
  }

  function createChat() {  
  
    const newChat = {  
      id: createId(),  
      title: "New Conversation",  
      messages: [],  
      createdAt: Date.now(),  
      updatedAt: Date.now()  
    };  
  
    chats.unshift(newChat);  
  
    currentChatId = newChat.id;  
  
    saveChats();  
  
    renderHistory();  
  
    renderMessages();  
  
  }  
  
  /* RENDER HISTORY */  
  
  function renderHistory() {  
  
    historyArea.innerHTML = "";  
  
    chats.forEach(item => {  
  
      const button = document.createElement("button");  
  
      button.type = "button";  
  
      button.className =  
        "ax-history-item" +  
        (item.id === currentChatId ? " active" : "");  
  
      button.textContent = item.title || "New Conversation";  
  
      button.title = button.textContent;  
  
      button.addEventListener("click", () => {  
  
        currentChatId = item.id;  
  
        renderHistory();  
  
        renderMessages();  
  
        sidebar.classList.remove("open");  
  
      });  
  
      historyArea.appendChild(button);  
  
    });  
  
  }

      const tools = document.createElement("div");

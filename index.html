
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXON AI</title>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: white;
      min-height: 100vh;
    }
    .center {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      background: #111b2d;
      border: 1px solid #263650;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 50px #0008;
    }
    h1 { text-align: center; color: #64b5ff; }
    .sub { text-align: center; color: #9aabc3; }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #34445e;
      background: #091323;
      color: white;
      outline: none;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }
    .primary { background: #2585ee; color: white; }
    .google { background: white; color: #222; }
    .demo { background: #263650; color: white; }
    .switch {
      text-align: center;
      color: #70b8ff;
      cursor: pointer;
      margin-top: 18px;
    }
    .forgot {
      text-align: right;
      color: #70b8ff;
      cursor: pointer;
      font-size: 13px;
      margin-top: 8px;
    }
    #app { display: none; }
    #messages {
      height: 55vh;
      overflow-y: auto;
      background: #091323;
      padding: 15px;
      border-radius: 12px;
      margin: 15px 0;
    }
    .msg {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      background: #1c2b42;
      overflow-wrap: anywhere;
    }
    .error { color: #ff8585; text-align: center; font-size: 14px; }
    .success { color: #80e8a2; text-align: center; font-size: 14px; }
    .hidden { display: none; }
    .chatrow { display: flex; gap: 8px; }
    .chatrow input { flex: 1; min-width: 0; }
    .chatrow button { width: 90px; }
  </style>
</head>

<body>

<div class="center" id="authScreen">
  <div class="panel">
    <h1>AXON AI</h1>
    <p class="sub" id="authTitle">Welcome back</p>

    <div id="nameBox" class="hidden">
      <input id="name" type="text" placeholder="Your name">
    </div>

    <input id="email" type="email" placeholder="Email address" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <div class="forgot" id="forgot">Forgot password?</div>

    <button class="primary" id="emailBtn">Sign In</button>
    <button class="google" id="googleBtn">G  Continue with Google</button>
    <button class="demo" id="demoBtn">Quick Demo</button>

    <p class="switch" id="switchMode">Create a new account</p>
    <p id="status" class="error"></p>
  </div>
</div>

<div class="center" id="app">
  <div class="panel" style="max-width:650px">
    <h1>AXON AI</h1>
    <p class="sub" id="welcome"></p>
    <div id="messages"></div>
    <div class="chatrow">
      <input id="chatInput" placeholder="Message AXON AI...">
      <button class="primary" id="sendBtn">Send</button>
    </div>
    <button class="demo" id="logoutBtn">Sign Out</button>
  </div>
</div>

<script>
(() => {
  const firebaseConfig = {
    apiKey: "AIzaSyA-YnGuAr8BdGt8xbo0Eq06lijQEPoeTC8",
    authDomain: "axon-ai-9ee3b.firebaseapp.com",
    databaseURL: "https://axon-ai-9ee3b-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "axon-ai-9ee3b",
    storageBucket: "axon-ai-9ee3b.firebasestorage.app",
    messagingSenderId: "304665322304",
    appId: "1:304665322304:web:b409df4442f3cf018710a5",
    measurementId: "G-NBP2KRZWSG"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const $ = id => document.getElementById(id);

  let isSignup = false;
  let currentUser = null;
  let demoMode = false;

  function showStatus(message, success = false) {
    $("status").textContent = message;
    $("status").className = success ? "success" : "error";
  }

  function setMode(signup) {
    isSignup = signup;
    $("nameBox").classList.toggle("hidden", !signup);
    $("authTitle").textContent = signup ? "Create your AXON account" : "Welcome back";
    $("emailBtn").textContent = signup ? "Create Account" : "Sign In";
    $("switchMode").textContent = signup ? "Already have an account? Sign In" : "Create a new account";
    $("password").autocomplete = signup ? "new-password" : "current-password";
    showStatus("");
  }

  $("switchMode").onclick = () => setMode(!isSignup);

  $("emailBtn").onclick = async () => {
    const email = $("email").value.trim();
    const password = $("password").value;
    const name = $("name").value.trim();

    if (!email || !password) return showStatus("Email and password are required.");
    if (password.length < 6) return showStatus("Password must be at least 6 characters.");
    if (isSignup && !name) return showStatus("Please enter your name.");

    $("emailBtn").disabled = true;

    try {
      if (isSignup) {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        await result.user.updateProfile({ displayName: name });
        await saveProfile(result.user, name);
      } else {
        const result = await auth.signInWithEmailAndPassword(email, password);
        await saveProfile(result.user);
      }
    } catch (error) {
      showStatus(error.message);
    } finally {
      $("emailBtn").disabled = false;
    }
  };

  $("googleBtn").onclick = async () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    try {
      await auth.signInWithPopup(provider);
    } catch (error) {
      if (error.code === "auth/popup-blocked" ||
          error.code === "auth/operation-not-supported-in-this-environment") {
        try {
          await auth.signInWithRedirect(provider);
        } catch (redirectError) {
          showStatus(redirectError.message);
        }
      } else {
        showStatus(error.message);
      }
    }
  };

  auth.getRedirectResult().catch(error => showStatus(error.message));

  $("forgot").onclick = async () => {
    const email = $("email").value.trim();
    if (!email) return showStatus("Enter your email address first.");

    try {
      await auth.sendPasswordResetEmail(email);
      showStatus("Password reset email sent. Check your inbox.", true);
    } catch (error) {
      showStatus(error.message);
    }
  };

  $("demoBtn").onclick = () => {
    demoMode = true;
    currentUser = {
      uid: "quick-demo",
      displayName: "AXON Demo User",
      email: "demo@axon.ai"
    };
    enterApp(currentUser);
  };

  async function saveProfile(user, name) {
    const profile = {
      name: name || user.displayName || "AXON User",
      email: user.email || "",
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    };

    await db.ref("users/" + user.uid + "/profile").update(profile);
  }

  function enterApp(user) {
    $("authScreen").style.display = "none";
    $("app").style.display = "flex";
    $("welcome").textContent = "Welcome, " + (user.displayName || "User");

    if (!demoMode) loadChats(user.uid);
  }

  function escapeHTML(value) {
    return value.replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[char]);
  }

  function addMessage(text, sender) {
    const item = document.createElement("div");
    item.className = "msg";
    item.innerHTML = "<b>" + escapeHTML(sender) + ":</b> " + escapeHTML(text);
    $("messages").appendChild(item);
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  async function loadChats(uid) {
    const snapshot = await db.ref("users/" + uid + "/chats")
      .limitToLast(50).once("value");

    $("messages").innerHTML = "";
    snapshot.forEach(child => {
      const chat = child.val();
      if (chat && chat.userMessage) addMessage(chat.userMessage, "You");
      if (chat && chat.aiReply) addMessage(chat.aiReply, "AXON AI");
    });
  }

  async function sendMessage() {
    const message = $("chatInput").value.trim();
    if (!message) return;

    $("chatInput").value = "";
    addMessage(message, "You");

    if (demoMode) {
      addMessage("Demo mode is active. Sign in to use the AI service.", "AXON AI");
      return;
    }

    if (!currentUser) return;

    const id = db.ref("users/" + currentUser.uid + "/chats").push().key;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "AI request failed");

      const reply = data.reply || data.message || "No response received.";
      addMessage(reply, "AXON AI");

      await db.ref("users/" + currentUser.uid + "/chats/" + id).set({
        userMessage: message,
        aiReply: reply,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
    } catch (error) {
      addMessage("Error: " + error.message, "AXON AI");
    }
  }

  $("sendBtn").onclick = sendMessage;
  $("chatInput").addEventListener("keydown", event => {
    if (event.key === "Enter") sendMessage();
  });

  $("logoutBtn").onclick = async () => {
    if (!demoMode) await auth.signOut();
    demoMode = false;
    currentUser = null;
    $("app").style.display = "none";
    $("authScreen").style.display = "flex";
    $("messages").innerHTML = "";
    showStatus("You have signed out.", true);
  };

  auth.onAuthStateChanged(async user => {
    if (user) {
      currentUser = user;
      demoMode = false;
      try {
        await saveProfile(user);
        enterApp(user);
      } catch (error) {
        showStatus("Database error: " + error.message);
      }
    } else if (!demoMode) {
      currentUser = null;
      $("app").style.display = "none";
      $("authScreen").style.display = "flex";
    }
  });

  setMode(false);
})();
</script>
</body>
</html>
